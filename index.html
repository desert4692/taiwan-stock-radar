<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V3.9.9.1</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 15px}h1,h2{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:#fff;font-weight:800}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 17px;margin:17px 0}.marketline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pill,.tag{padding:5px 9px;border-radius:999px;background:#17243a;font-size:12px}.section{margin-top:25px}.section h2{font-size:20px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.price{font-size:32px;margin:8px 0 2px}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.live{font-weight:900;margin:8px 0}.trade{background:#0b1422;border-radius:12px;padding:11px;line-height:1.9;margin-top:10px}.actionbox{border:1px solid #31435e;background:#0b1422;border-radius:13px;padding:12px;margin-top:10px}.actiontitle{font-weight:900;font-size:17px}.empty{padding:22px;color:#ffd166}.foot{margin-top:25px;font-size:12px;color:#71849e}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>台股決策雷達 <span class="green" style="font-size:14px">V3.9.9.1</span></h1><div class="sub">盤前試撮 → 當沖進場雷達 → ETF進出場決策</div></div><button class="btn" id="refresh">↻ 強制刷新</button></div>
<div class="panel" id="status">讀取資料…</div>
<section class="section" id="preSec"><h2>🌅 盤前試撮雷達</h2><div class="sub">08:30～08:59只做優先觀察；試撮不是實際成交訊號。</div><div class="grid" id="pre"></div></section>
<section class="section" id="liveSec"><h2>⚡ V3.9.9.1 當沖進場雷達</h2><div class="sub">只保留可現股當沖標的。🟢已確認進場條件；🟡等待；🔴不追。</div><div class="grid" id="live"></div></section>
<section class="section"><h2>📌 固定 ETF 進出場雷達</h2><div class="sub">直接顯示目前該等待、進場、減碼或退出。0050中長線配置；00685L中短線波段。</div><div class="grid" id="etfs"></div></section>
<div class="foot">每30秒重新讀取。盤中雷達不為湊滿5檔而放寬條件；ETF價格區間為策略參考，仍需依實際市場狀況執行。</div></main><script>
const $=x=>document.getElementById(x),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(2)+'%':'—';
function preCard(x,i){let im=+x.imbalance||0;return `<article class="card"><div class="row"><b>#${i+1} ${x.code} ${x.name}</b><span class="tag">${x.market||''}</span></div><div class="price">${f(x.probe_price)}</div><div class="${(+x.probe_pct||0)>=0?'green':'red'}">試撮 ${sg(x.probe_pct)}</div><div class="live ${x.status==='盤前優先觀察'?'green':'yellow'}">${x.status||'資料觀察中'}</div><div class="trade">參考價：<b>${f(x.reference)}</b><br>最佳買／賣：<b>${f(x.best_bid)}／${f(x.best_ask)}</b><br>五檔買盤：<b>${f(x.bid5_volume)}</b>｜賣盤：<b>${f(x.ask5_volume)}</b><br>買賣力道：<b class="${im>15?'green':im<-15?'red':'yellow'}">${im>0?'+':''}${f(im)}%</b></div></article>`}
function liveCard(x){let green=!!x.entry_confirmed||String(x.status).includes('🟢'),br=String(x.status).includes('突破');return `<article class="card"><div class="row"><b>#${x.rank||'—'} ${x.code} ${x.name}</b><span class="tag">${green?'已確認':'等待'}</span></div><div class="price">${f(x.close)}</div><div class="${(+x.pct||0)>=0?'green':'red'}">${sg(x.pct)}</div><div class="live ${green?'green':String(x.status).includes('🔴')?'red':'yellow'}">${x.status||'等待'}</div><div class="trade">${br?`<b>🚀 突破進場</b><br>確認價：<b>${f(x.breakout_entry)}</b>｜不追：<b>${f(x.no_chase)}</b><br><span class="red">停損：<b>${f(x.breakout_stop)}</b></span><br><span class="green">第一停利：<b>${f(x.breakout_tp1)}</b>｜第二停利：<b>${f(x.breakout_tp2)}</b></span>`:`<b>📉 拉回進場</b><br>${x.pullback_condition||''}<br>價格：<b>${f(x.pullback_entry?.[0])}～${f(x.pullback_entry?.[1])}</b><br><span class="red">停損：<b>${f(x.stop)}</b></span><br><span class="green">第一停利：<b>${f(x.take_profit1)}</b>｜第二停利：<b>${f(x.take_profit2)}</b></span>`}<br><small>RR ${f(br?x.breakout_rr:x.rr)}｜優先分 ${f(x.entry_priority)}</small></div></article>`}
function zone(px,z){return Array.isArray(z)&&z.length>1&&px>=+z[0]&&px<=+z[1]}
function dist(px,z){if(!Array.isArray(z)||z.length<2)return null;if(px>+z[1])return (px/+z[1]-1)*100;if(px<+z[0])return (px/+z[0]-1)*100;return 0}
function e50(x){let c=+x.close,z1=x.add_zone_1,z2=x.add_zone_2,z3=x.deep_add_zone,act='🟡 等待第一加碼區',cls='yellow',next=z1;
if(zone(c,z3)){act='🟢 深度回檔加碼區';cls='green';next=z3}else if(zone(c,z2)){act='🟢 第二加碼區';cls='green';next=z2}else if(zone(c,z1)){act='🟢 第一加碼區';cls='green';next=z1}
let d=dist(c,next),msg=zone(c,z1)||zone(c,z2)||zone(c,z3)?'已進入配置區，可依原定資金分批配置':'尚未進入加碼區，等待即可';
return `<article class="card"><div class="row"><b>0050 元大台灣50</b><span class="tag">中長線配置</span></div><div class="price">${f(c)}</div><div class="live ${cls}">${act}</div>${d!==null&&d>0?`<div class="sub">距第一加碼區上緣約 <b>${f(d)}%</b></div>`:''}<div class="actionbox"><div class="actiontitle ${cls}">現在：${msg}</div></div><div class="trade"><b>🟢 什麼時候買？</b><br>第一加碼：<b>${f(z1?.[0])}～${f(z1?.[1])}</b><br>第二加碼：<b>${f(z2?.[0])}～${f(z2?.[1])}</b><br>深度回檔：<b>${f(z3?.[0])}～${f(z3?.[1])}</b><br><small>0050定位為中長線配置，不套用短線停利／停損。</small></div></article>`}
function e685(x){let p=x.plans||{},a=p.pullback||{},b=p.breakout||{},c=+x.close,pz=x.pullback_zone||[],be=+(b.entry??x.breakout),nc=+(b.no_chase??x.no_chase),r1=+(a.reduce_1??x.reduce_1),r2=+(a.reduce_2??x.reduce_2),ex=+x.exit;
let state='🟡 等待進場',cls='yellow',hint='等待拉回區或突破條件';
if(ex&&c<=ex){state='🔴 趨勢退出區';cls='red';hint='已有部位優先執行退出規則'}
else if(c>=r2){state='🔴 已達第二減碼區';cls='red';hint='已有部位可依計畫第二次減碼；未持有不追價'}
else if(c>=r1){state='🟢 已達第一減碼區';cls='green';hint='已有部位可依計畫第一次減碼'}
else if(nc&&c>nc){state='🔴 超過不追價';cls='red';hint='未持有不追；已有部位依防守／減碼計畫'}
else if(be&&c>=be){state='🟢 突破進場區';cls='green';hint='突破模式成立時觀察進場'}
else if(zone(c,pz)){state='🟢 拉回進場區';cls='green';hint='進入拉回區，配合趨勢條件觀察進場'}
return `<article class="card"><div class="row"><b>00685L 群益臺灣加權正2</b><span class="tag">${x.market_state||'—'}｜中短線波段</span></div><div class="price">${f(c)}</div><div class="live ${cls}">${state}</div><div class="actionbox"><div class="actiontitle ${cls}">現在：${hint}</div></div><div class="trade"><b>🟢 什麼時候進？</b><br>📉 拉回區：<b>${f(pz?.[0])}～${f(pz?.[1])}</b>｜參考進場 <b>${f(a.entry)}</b><br>🚀 突破：<b>${f(be)}</b>｜超過 <b>${f(nc)}</b> 不追<br><br><b>🔴 什麼時候出？</b><br>拉回單防守：<b>${f(a.defense)}</b><br>第一減碼：<b>${f(r1)}</b>｜第二減碼：<b>${f(r2)}</b><br>趨勢退出：<b>${f(ex)}</b><br><br><b>突破單</b>：防守 ${f(b.defense)}｜減碼 ${f(b.reduce_1)}／${f(b.reduce_2)}</div></article>`}
function tw(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}))}
async function get(fn){try{let r=await fetch('./'+fn+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():{}}catch{return {}}}
async function load(){let [p,v,e]=await Promise.all([get('v371-preopen.json'),get('v37-intraday.json'),get('etf-radar-v441.json')]);let n=tw(),wd=n.getDay(),m=n.getHours()*60+n.getMinutes(),pre=wd>=1&&wd<=5&&m>=510&&m<540,live=wd>=1&&wd<=5&&m>=540&&m<=810;$('preSec').style.display=pre?'block':'none';$('liveSec').style.display=pre?'none':'block';$('pre').innerHTML=(p.top5||[]).map(preCard).join('')||'<div class="panel empty">盤前資料累積中，目前尚無優先觀察標的。</div>';$('live').innerHTML=(v.opportunities||[]).map(liveCard).join('')||'<div class="panel empty">目前沒有符合條件的當沖機會。</div>';$('etfs').innerHTML=e['0050']&&e['00685L']?e50(e['0050'])+e685(e['00685L']):'<div class="panel empty">ETF資料尚未產生。</div>';let u=pre?p.updated_at:v.updated_at;$('status').innerHTML=`<b>${pre?'🌅 盤前試撮模式':live?'⚡ 當沖短線模式':'⏸ 非盤中時段'}</b><div class="marketline"><span class="pill">盤中 V${v.version||'—'}</span><span class="pill">可當沖 ${v.daytrade_eligible_count??'—'}檔</span><span class="pill">有效盤中 ${v.valid_live_quotes??'—'}檔</span><span class="pill">候選 ${(v.opportunities||[]).length}檔</span></div><div class="sub">資料更新：${u?new Date(u).toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}):'—'}</div>`}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
