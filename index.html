<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}h1{font-size:28px;margin:0}.sub,.muted{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:14px 18px;background:#1769e8;color:white;font-weight:800;cursor:pointer}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:16px 18px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-size:13px;background:#1d2a3d;padding:5px 10px;border-radius:999px}.price{font-size:36px;margin:10px 0 4px}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.score{background:#0b1422;border-radius:12px;padding:10px}.score b{font-size:22px}.reason{font-size:14px;line-height:1.65;color:#b7c6da}.zone{margin-top:12px;padding-top:12px;border-top:1px solid #26364e;font-size:14px;line-height:1.7}.warn{color:#ffd166}.foot{margin-top:22px;font-size:12px;color:#71849e}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:32px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>台股決策雷達 <span style="font-size:14px;color:#63f3a8">V2</span></h1><div class="sub">上市＋上櫃｜趨勢、量能、突破、乖離分開評分</div></div><button class="btn" id="refresh">↻ 更新分析</button></div><div class="panel" id="status">讀取 V2 分析資料中…</div><section class="grid" id="cards"></section><div class="foot">V2 為技術面篩選工具，不代表獲利保證。進場區與轉弱價是依歷史價格結構計算的觀察值。</div></main><script>
const $=id=>document.getElementById(id);const f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—';
function cls(s){return s.includes('可觀察')?'green':s.includes('拉回')?'yellow':'red'}
function render(d){const a=d.picks||[];$('status').innerHTML=`資料更新：<b>${d.updated_at||'—'}</b><br>掃描 ${d.universe||0} 檔｜歷史資料完整：${d.history_ready||0} 檔 ${d.note?`<br><span class="warn">${d.note}</span>`:''}`;$('cards').innerHTML=a.map(x=>`<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.market}</span></div><div class="price">${f(x.close)}</div><b class="${cls(x.action)}">${x.action}</b><div class="scores"><div class="score">強勢分數<br><b>${x.strength}</b></div><div class="score">進場分數<br><b>${x.entry}</b></div></div><div class="reason">${(x.reasons||[]).join('｜')}</div><div class="zone">觀察區：<b>${x.entry_low?f(x.entry_low):'—'} ～ ${x.entry_high?f(x.entry_high):'—'}</b><br>跌破轉弱：<b>${x.stop?f(x.stop):'—'}</b><br>5MA ${f(x.ma5)}｜20MA ${f(x.ma20)}｜量比 ${f(x.volume_ratio)}×｜20日位置 ${f(x.pos20)}%</div></article>`).join('')||'<div class="panel">目前沒有足夠資料產生 V2 候選。</div>'}
async function load(){try{$('status').textContent='正在讀取最新 V2 分析…';const r=await fetch('./analysis.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('analysis.json 尚未建立');render(await r.json())}catch(e){$('status').innerHTML='V2 資料尚未準備完成：'+e.message+'<br>請先執行 GitHub Actions 的 Update Taiwan Market Data V2。'}}$('refresh').onclick=load;load();
</script></body></html>
