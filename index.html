<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V2.2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:0;font-size:28px}.sub,.muted{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:#fff;font-weight:800;cursor:pointer}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.row{display:flex;justify-content:space-between;gap:10px}.tag{font-size:12px;background:#1d2a3d;padding:5px 9px;border-radius:999px}.price{font-size:34px;margin:9px 0 2px}.pct{font-size:13px;color:#8ea2bd}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.score{background:#0b1422;border-radius:12px;padding:10px}.score b{font-size:22px}.zone{background:#0b1422;border-radius:12px;padding:11px;margin:11px 0;line-height:1.7}.ok{color:#63f3a8}.risk{color:#ffb36b}.reason,.summary{font-size:13px;line-height:1.65;color:#b7c6da}.summary{margin-top:10px;color:#e8eef8}.metrics{margin-top:11px;padding-top:11px;border-top:1px solid #26364e;font-size:13px;line-height:1.75;color:#aabbd0}.foot{margin-top:22px;font-size:12px;color:#71849e}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:31px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>台股決策雷達 <span style="font-size:14px;color:#63f3a8">V2.2</span></h1><div class="sub">強勢 ≠ 適合追價｜加入乖離、爆量與高檔風險</div></div><button class="btn" id="refresh">↻ 更新分析</button></div><div class="panel" id="status">讀取分析資料中…</div><section class="grid" id="cards"></section><div class="foot">技術面篩選僅供研究與觀察，不代表獲利保證。觀察區與轉弱價會隨行情更新。</div></main><script>
const $=id=>document.getElementById(id),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(1)+'%':'—';function cls(s){return s.includes('可觀察')?'green':s.includes('拉回')?'yellow':'red'}
function render(d){$('status').innerHTML=`版本 <b>${d.version||'—'}</b>｜更新：<b>${d.updated_at||'—'}</b><br>掃描 ${d.universe||0} 檔｜完整歷史候選 ${d.history_ready||0} 檔`;$('cards').innerHTML=(d.picks||[]).map(x=>`<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.market}</span></div><div class="price">${f(x.close)}</div><div class="pct">當日 ${sg(x.pct)}</div><b class="${cls(x.action)}">${x.action}</b><div class="scores"><div class="score">強勢分數<br><b>${x.strength}</b></div><div class="score">進場分數<br><b>${x.entry}</b></div></div><div class="zone">建議觀察區：<b>${f(x.entry_low)} ～ ${f(x.entry_high)}</b><br>目前：<b class="${x.in_zone?'ok':'risk'}">${x.in_zone?'位於觀察區':'不在觀察區'}</b><br>跌破轉弱：<b>${f(x.stop)}</b></div><div class="reason">優勢：${(x.reasons||[]).join('｜')||'—'}</div><div class="reason risk">風險：${(x.risks||[]).join('｜')||'目前無明顯過熱訊號'}</div><div class="summary">${x.summary||''}</div><div class="metrics">5MA ${f(x.ma5)}｜20MA ${f(x.ma20)}<br>5MA乖離 ${sg(x.bias5)}｜20MA乖離 ${sg(x.bias20)}<br>量比 ${f(x.volume_ratio)}×｜20日位置 ${f(x.pos20)}%</div></article>`).join('')||'<div class="panel">目前沒有足夠候選。</div>'}
async function load(){try{$('status').textContent='正在讀取最新分析…';const r=await fetch('./analysis.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('analysis.json 尚未建立');render(await r.json())}catch(e){$('status').textContent='資料讀取失敗：'+e.message}}$('refresh').onclick=load;load();
</script></body></html>
