<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V3.1</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 15px}h1,h2{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub,.muted{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:white;font-weight:800;cursor:pointer}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 17px;margin:17px 0}.marketline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pill{padding:5px 9px;border-radius:999px;background:#17243a;font-size:12px}.section{margin-top:25px}.section h2{font-size:20px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.etfs{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.tag{font-size:12px;background:#1d2a3d;padding:5px 9px;border-radius:999px}.price{font-size:32px;margin:8px 0 2px}.pct{font-size:13px;color:#8ea2bd}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}.score,.zone{background:#0b1422;border-radius:12px;padding:10px}.score b{font-size:21px}.signal{border:1px solid #314967}.zone{line-height:1.7;margin:10px 0}.tradeplan{background:#0d1928;border:1px solid #314967;border-radius:12px;padding:11px;margin:10px 0;line-height:1.8}.ok{color:#63f3a8}.risk{color:#ffb36b}.reason,.summary,.metrics{font-size:13px;line-height:1.65;color:#b7c6da}.summary{color:#e8eef8;margin-top:8px}.metrics{margin-top:10px;padding-top:10px;border-top:1px solid #26364e}.empty{padding:22px;text-align:center;color:#ffd166}.foot{margin-top:25px;font-size:12px;color:#71849e}@media(max-width:850px){.grid,.etfs{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:30px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>台股決策雷達 <span class="green" style="font-size:14px">V3.1</span></h1><div class="sub">自動時段模式｜全市場掃描｜固定 ETF｜進場／停利／停損</div></div><button class="btn" id="refresh">↻ 重新讀取資料</button></div><div class="panel" id="status">讀取最新分析…</div>
<section class="section"><h2>📌 固定 ETF 雷達</h2><div class="sub">訊號強度為技術條件綜合分數，不代表上漲機率。</div><div class="grid etfs" id="etfs"></div></section>
<section class="section" id="focusSec"><h2 id="focusTitle"></h2><div class="sub" id="focusSub"></div><div class="grid" id="focus"></div></section>
<div class="foot">06:00–09:00 盤前標的｜09:00–13:30 今日行動｜13:30 後明日重點觀察。行情為排程資料快照，非券商逐筆即時報價；技術訊號僅供研究與觀察。</div></main><script>
const $=id=>document.getElementById(id),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(1)+'%':'—';function cc(s){return (s||'').includes('可觀察')?'green':(s||'').includes('拉回')?'yellow':'red'}
function twNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}))}
function mode(){const d=twNow(),day=d.getDay(),m=d.getHours()*60+d.getMinutes();if(day===0||day===6)return'night';if(m>=360&&m<540)return'pre';if(m>=540&&m<810)return'intraday';return'night'}
function card(x,etf=false){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.market||''}</span></div><div class="price">${f(x.close)}</div><div class="pct">最新取得價｜當日 ${sg(x.pct)}</div><b class="${cc(x.action)}">${x.action||''}</b><div class="scores"><div class="score">強勢<br><b>${x.strength}</b></div><div class="score">進場<br><b>${x.entry}</b></div>${etf?`<div class="score signal">訊號<br><b>${x.signal??'—'}</b><br><span class="muted">${x.signal_label||''}</span></div>`:''}</div><div class="tradeplan"><b>📍 交易計畫</b><br>進場區：<b>${f(x.plan_entry_low??x.entry_low)} ～ ${f(x.plan_entry_high??x.entry_high)}</b><br>參考進場價：<b>${f(x.plan_entry)}</b><br><span class="green">第一停利：<b>${f(x.take_profit1)}</b></span><br><span class="green">第二停利：<b>${f(x.take_profit2)}</b></span><br><span class="red">停損／轉弱：<b>${f(x.plan_stop??x.stop)}</b></span></div><div class="reason">優勢：${(x.reasons||[]).join('｜')||'—'}</div><div class="reason risk">風險：${(x.risks||[]).join('｜')||'目前無明顯過熱訊號'}</div></article>`}
function watchCard(x,pre=false){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${pre?'盤前':'明日'}</span></div><div class="price">${f(x.close)}</div><div class="pct">前一收盤／收盤資料｜當日 ${sg(x.pct)}</div><b class="${(x.tomorrow_score||0)>=75?'green':'yellow'}">${pre?'今日盤前':'明日'} ${x.tomorrow_label||'觀察'}</b><div class="scores"><div class="score">觀察分<br><b>${x.tomorrow_score??'—'}</b></div><div class="score">強勢<br><b>${x.strength}</b></div><div class="score">進場<br><b>${x.entry}</b></div></div><div class="zone"><b>A｜拉回觀察</b>：${f(x.tomorrow_low)} ～ ${f(x.tomorrow_high)}<br><b>B｜突破確認</b>：站上 ${f(x.breakout_price)} 且量能延續<br><b class="risk">不追價</b>：高於 ${f(x.no_chase_price)}<br><span class="red">轉弱價</span>：<b>${f(x.plan_stop??x.stop)}</b></div><div class="reason">條件：${(x.tomorrow_reasons||[]).join('｜')||'—'}</div><div class="reason risk">風險：${(x.tomorrow_risks||[]).join('｜')||'目前無明顯過熱訊號'}</div></article>`}
function render(d){const md=mode(),t=twNow();$('status').innerHTML=`<b>分析更新：${d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}):'—'}</b><div class="marketline"><span class="pill">${md==='pre'?'🌅 盤前模式':md==='intraday'?'🟢 盤中模式':'🌙 收盤模式'}</span><span class="pill">台灣時間 ${t.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><span class="pill">版本 ${d.version||'—'}</span><span class="pill">全市場 ${d.universe||0} 檔</span><span class="pill">完整分析 ${d.history_ready||0} 檔</span></div>`;
$('etfs').innerHTML=(d.fixed_etfs||[]).map(x=>card(x,true)).join('')||'<div class="panel empty">固定 ETF 資料暫時無法取得</div>';
if(md==='intraday'){$('focusTitle').textContent='🟢 今日行動標的';$('focusSub').textContent='09:00–13:30：使用當日最新行情重新判斷，最多 5 檔。';$('focus').innerHTML=(d.action_now||[]).map(x=>card(x)).join('')||'<div class="panel empty">目前沒有符合進場條件的股票，先等待。</div>'}
else {const pre=md==='pre';$('focusTitle').textContent=pre?'🌅 今日盤前標的':'🌙 明日重點觀察';$('focusSub').textContent=pre?'06:00–09:00：以前一交易日收盤分析提前準備今天要盯的標的；09:00 後會重新用盤中行情判斷。':'13:30 後：以前一收盤分析準備下一交易日優先觀察標的。';$('focus').innerHTML=(d.tomorrow_watch||[]).map(x=>watchCard(x,pre)).join('')||'<div class="panel empty">目前沒有符合觀察條件的股票。</div>'}}
async function load(){try{$('status').textContent='正在讀取最新 V3.1 分析…';const r=await fetch('./analysis.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('analysis.json 尚未建立');render(await r.json())}catch(e){$('status').textContent='資料讀取失敗：'+e.message}}$('refresh').onclick=load;load();setInterval(()=>load(),60000);
</script></body></html>
