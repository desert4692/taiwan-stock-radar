<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V3.4</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 15px}h1,h2{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:#fff;font-weight:800}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 17px;margin:17px 0}.marketline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pill,.tag{padding:5px 9px;border-radius:999px;background:#17243a;font-size:12px}.section{margin-top:25px}.section h2{font-size:20px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.etfs{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.price{font-size:32px;margin:8px 0 2px}.pct{font-size:13px;color:#8ea2bd}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.live{font-weight:900;margin:8px 0}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}.score,.trade{background:#0b1422;border-radius:12px;padding:10px}.score b{font-size:21px}.trade{line-height:1.8;margin-top:10px}.empty{padding:22px;color:#ffd166}.foot{margin-top:25px;font-size:12px;color:#71849e}@media(max-width:850px){.grid,.etfs{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="wrap"><div class="top"><div><h1>台股決策雷達 <span class="green" style="font-size:14px">V3.4</span></h1><div class="sub">題材資金流 → 盤前鎖定 → 盤中追蹤 → 新機會補充</div></div><button class="btn" id="refresh">↻ 強制刷新</button></div><div class="panel" id="status">讀取資料…</div>
<section class="section"><h2>🔥 熱門題材 Top 5</h2><div class="sub">優先辨識短線題材；未命中題材才使用證交所產業分類。</div><div class="marketline" id="sectors"></div></section>
<section class="section"><h2>🔒 今日鎖定標的</h2><div class="sub">前一交易日選出，開盤後不換股，只更新價格與進場狀態。</div><div class="grid" id="locked"></div></section>
<section class="section"><h2>⚡ 盤中新機會</h2><div class="sub">補充名單，不會取代今日鎖定標的。</div><div class="grid" id="opp"></div></section>
<section class="section"><h2>📌 固定 ETF 雷達</h2><div class="grid etfs" id="etfs"></div></section>
<div class="foot">V3.4 題材分析 + V3.3 盤中追蹤。盤中後端目標每 5 分鐘更新；App 每 30 秒自動讀取。行情為排程快照，非券商逐筆即時報價。</div></main><script>
const $=x=>document.getElementById(x),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(1)+'%':'—';function cl(s){return(s||'').includes('🟢')?'green':(s||'').includes('🔴')?'red':'yellow'}
function card(x){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.sector||x.market||''}</span></div><div class="price">${f(x.close)}</div><div class="pct">當日 ${sg(x.pct)}</div><div class="live ${cl(x.live_status)}">${x.live_status||x.action||'等待'}</div><div class="scores"><div class="score">短線<br><b>${x.momentum_score??x.strength??'—'}</b></div><div class="score">進場<br><b>${x.entry??'—'}</b></div><div class="score">題材<br><b>${x.sector_heat??'—'}</b></div></div><div class="trade">拉回區：<b>${f(x.plan_entry_low??x.entry_low)}～${f(x.plan_entry_high??x.entry_high)}</b><br>突破：<b>${f(x.breakout_price)}</b>｜不追：<b>${f(x.no_chase_price)}</b><br><span class="green">停利1 ${f(x.take_profit1)}｜停利2 ${f(x.take_profit2)}</span><br><span class="red">停損 ${f(x.plan_stop??x.stop)}</span></div></article>`}
function etfCard(x){const lo=x.plan_entry_low??x.entry_low??x.tomorrow_low,hi=x.plan_entry_high??x.entry_high??x.tomorrow_high,bp=x.breakout_price,nc=x.no_chase_price,tp1=x.take_profit1,tp2=x.take_profit2,stop=x.plan_stop??x.stop;return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">固定 ETF</span></div><div class="price">${f(x.close)}</div><div class="pct">當日 ${sg(x.pct)}</div><div class="live ${cl(x.signal_label||x.action)}">${x.signal_label||x.action||'固定觀察'}</div><div class="scores"><div class="score">訊號<br><b>${x.signal??x.signal_score??'—'}</b></div><div class="score">強勢<br><b>${x.strength??'—'}</b></div><div class="score">進場<br><b>${x.entry??'—'}</b></div></div><div class="trade">拉回區：<b>${f(lo)}～${f(hi)}</b><br>突破確認：<b>${f(bp)}</b><br>不追價：<b>${f(nc)}</b><br><span class="green">第一停利 ${f(tp1)}｜第二停利 ${f(tp2)}</span><br><span class="red">停損／轉弱 ${f(stop)}</span></div></article>`}
function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
async function load(){try{let a=await fetch('./analysis.json?t='+Date.now(),{cache:'no-store'});if(!a.ok)throw Error('analysis.json');let d=await a.json(),v={};try{let r=await fetch('./v33-state.json?t='+Date.now(),{cache:'no-store'});if(r.ok)v=await r.json()}catch{};const stateToday=v.trade_date===twDate();const locked=stateToday&&v.locked_watch?.length?v.locked_watch:(d.tomorrow_watch||[]);const opp=stateToday?(v.intraday_opportunities||[]):[];$('status').innerHTML=`<b>最新自動更新：${new Date((stateToday?v.updated_at:null)||d.updated_at).toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'})}</b><div class="marketline"><span class="pill">分析 V${d.version||'3.4'}</span><span class="pill">盤中追蹤 V${v.version||'3.3'}</span><span class="pill">🔒 ${locked.length} 檔</span><span class="pill">⚡ ${opp.length} 檔</span></div>`;const themes=d.hot_themes||d.hot_sectors||[];$('sectors').innerHTML=themes.map((x,i)=>`<span class="pill">${i+1}. ${x.sector} <b class="green">${x.heat}</b></span>`).join('');$('locked').innerHTML=locked.map(card).join('')||'<div class="panel empty">尚無鎖定標的</div>';$('opp').innerHTML=opp.map(card).join('')||'<div class="panel empty">目前沒有盤中新機會</div>';$('etfs').innerHTML=(d.fixed_etfs||[]).map(etfCard).join('')}catch(e){$('status').textContent='讀取失敗：'+e.message}}$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
