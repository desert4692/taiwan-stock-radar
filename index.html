<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股短線雷達 V3.7.1</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 15px}h1,h2{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:#fff;font-weight:800}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 17px;margin:17px 0}.marketline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pill,.tag{padding:5px 9px;border-radius:999px;background:#17243a;font-size:12px}.section{margin-top:25px}.section h2{font-size:20px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.price{font-size:32px;margin:8px 0 2px}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.live{font-weight:900;margin:8px 0}.trade{background:#0b1422;border-radius:12px;padding:11px;line-height:1.9;margin-top:10px}.empty{padding:22px;color:#ffd166}.foot{margin-top:25px;font-size:12px;color:#71849e}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>台股短線雷達 <span class="green" style="font-size:14px">V3.7.1</span></h1><div class="sub">盤前試撮 → 09:00實盤確認 → 只看進場與出場</div></div><button class="btn" id="refresh">↻ 強制刷新</button></div>
<div class="panel" id="status">讀取資料…</div>
<section class="section" id="preSec"><h2>🌅 盤前試撮雷達</h2><div class="sub">08:30～08:59只做優先觀察；試撮不是實際成交訊號。</div><div class="grid" id="pre"></div></section>
<section class="section" id="liveSec"><h2>⚡ V3.7 盤中新機會</h2><div class="sub">09:00後以實際行情確認。條件不足可以0檔，不硬湊。</div><div class="grid" id="live"></div></section>
<section class="section"><h2>📌 固定 ETF 雷達</h2><div class="sub">0050中長線配置；00685L中短線波段。</div><div class="grid" id="etfs"></div></section>
<div class="foot">App每30秒重新讀取。盤前試撮僅供候選篩選，09:00後仍需V3.7實盤條件確認。</div></main><script>
const $=x=>document.getElementById(x),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(2)+'%':'—';
function preCard(x,i){let im=+x.imbalance||0;return `<article class="card"><div class="row"><b>#${i+1} ${x.code} ${x.name}</b><span class="tag">${x.market||''}</span></div><div class="price">${f(x.probe_price)}</div><div class="${(+x.probe_pct||0)>=0?'green':'red'}">試撮 ${sg(x.probe_pct)}</div><div class="live ${x.status==='盤前優先觀察'?'green':'yellow'}">${x.status||'資料觀察中'}</div><div class="trade">參考價：<b>${f(x.reference)}</b><br>最佳買／賣：<b>${f(x.best_bid)}／${f(x.best_ask)}</b><br>五檔買盤：<b>${f(x.bid5_volume)}</b>｜賣盤：<b>${f(x.ask5_volume)}</b><br>買賣力道：<b class="${im>15?'green':im<-15?'red':'yellow'}">${im>0?'+':''}${f(im)}%</b><br>連續快照：<b>${x.snapshots??'—'}</b>${x.stability_spread!=null?`｜波動差 ${f(x.stability_spread)}%`:''}</div></article>`}
function liveCard(x){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.score??'—'}分</span></div><div class="price">${f(x.close)}</div><div class="live ${String(x.status).includes('🟢')?'green':String(x.status).includes('🔴')?'red':'yellow'}">${x.status||'等待'}</div><div class="trade"><b>📉 拉回進場</b><br>${x.pullback_condition||''}<br>價格：<b>${f(x.pullback_entry?.[0])}～${f(x.pullback_entry?.[1])}</b><br><br><b>🚀 突破進場</b><br>${x.breakout_condition||''}<br>突破：<b>${f(x.breakout_entry)}</b>｜不追：<b>${f(x.no_chase)}</b><br><br><span class="red">停損／轉弱：<b>${f(x.stop)}</b></span><br>${x.stop_condition||''}<br><span class="green">第一停利：<b>${f(x.take_profit1)}</b>｜第二停利：<b>${f(x.take_profit2)}</b></span></div></article>`}
function e50(x){return `<article class="card"><b>0050 元大台灣50</b><div class="price">${f(x.close)}</div><div class="live yellow">增加部位：${x.add_action||'等待'}</div><div class="trade">第一加碼：<b>${f(x.add_zone_1?.[0])}～${f(x.add_zone_1?.[1])}</b><br>第二加碼：<b>${f(x.add_zone_2?.[0])}～${f(x.add_zone_2?.[1])}</b><br>深度回檔：<b>${f(x.deep_add_zone?.[0])}～${f(x.deep_add_zone?.[1])}</b></div></article>`}
function e685(x){let p=x.plans||{},a=p.pullback||{},b=p.breakout||{};return `<article class="card"><b>00685L 群益臺灣加權正2</b><div class="price">${f(x.close)}</div><div class="live yellow">${x.action||'等待'}</div><div class="trade"><b>📉 拉回</b> ${f(x.pullback_zone?.[0])}～${f(x.pullback_zone?.[1])}<br>進場 ${f(a.entry)}｜防守 ${f(a.defense)}｜減碼 ${f(a.reduce_1)}／${f(a.reduce_2)}<br><br><b>🚀 突破</b> ${f(b.entry??x.breakout)}｜不追 ${f(b.no_chase??x.no_chase)}<br>防守 ${f(b.defense)}｜減碼 ${f(b.reduce_1)}／${f(b.reduce_2)}</div></article>`}
function tw(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}))}
async function get(fn){try{let r=await fetch('./'+fn+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():{}}catch{return {}}}
async function load(){let [p,v,e]=await Promise.all([get('v371-preopen.json'),get('v37-intraday.json'),get('etf-radar-v441.json')]);let n=tw(),wd=n.getDay(),m=n.getHours()*60+n.getMinutes(),pre=wd>=1&&wd<=5&&m>=510&&m<540,live=wd>=1&&wd<=5&&m>=540&&m<=810;$('preSec').style.display=pre?'block':'none';$('liveSec').style.display=pre?'none':'block';$('pre').innerHTML=(p.top5||[]).map(preCard).join('')||'<div class="panel empty">盤前資料累積中，目前尚無優先觀察標的。</div>';$('live').innerHTML=(v.opportunities||[]).map(liveCard).join('')||'<div class="panel empty">目前沒有符合條件的盤中新機會。</div>';$('etfs').innerHTML=e['0050']&&e['00685L']?e50(e['0050'])+e685(e['00685L']):'<div class="panel empty">ETF資料尚未產生。</div>';let u=pre?p.updated_at:v.updated_at;$('status').innerHTML=`<b>${pre?'🌅 盤前試撮模式':live?'⚡ 盤中短線模式':'⏸ 非盤中時段'}</b><div class="marketline"><span class="pill">盤前 ${p.version||'—'}</span><span class="pill">盤中 V${v.version||'—'}</span><span class="pill">盤前候選 ${(p.top5||[]).length}</span><span class="pill">盤中新機會 ${(v.opportunities||[]).length}</span></div><div class="sub">資料更新：${u?new Date(u).toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}):'—'}</div>`}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
