<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達</title><style>body{margin:0;background:#07111f;color:#eef5ff;font-family:Arial,'Noto Sans TC',sans-serif}.app{max-width:650px;margin:auto;padding:18px}.bar{display:flex;justify-content:space-between;align-items:center}.btn{background:#1769e0;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:bold}.box,.card{background:#0e1d2e;border:1px solid #203650;border-radius:18px;padding:16px;margin-top:14px}h1{font-size:25px;margin:6px 0}.muted{color:#9bb0c8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#10253b;border-radius:12px;text-align:center;padding:10px}.metric b{font-size:20px;display:block}.cards{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px}.name{font-weight:bold;font-size:18px}.price{font-weight:bold;font-size:21px;text-align:right}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.score{background:#091725;border-radius:10px;padding:9px}.green{color:#45d397}.yellow{color:#ffd166}.red{color:#ff6b6b}#error{white-space:pre-wrap;color:#ff9b9b;font-size:12px;margin-top:8px}</style></head><body><main class="app"><div class="bar"><div><b>台股決策雷達</b><div class="muted">GitHub Pages 網路版</div></div><button id="updateBtn" class="btn">↻ 更新行情</button></div><section class="box"><div class="muted">今日決策中心</div><h1>今天真正需要看的股票</h1><div class="grid"><div class="metric"><b class="green" id="go">0</b>可觀察</div><div class="metric"><b class="yellow" id="wait">0</b>等拉回</div><div class="metric"><b class="red" id="hot">0</b>不追</div></div></section><section class="box"><b>行情狀態</b><div id="status" class="muted" style="margin-top:7px">網頁已正常載入。請按「更新行情」。</div><div id="error"></div></section><div id="cards" class="cards"><div class="card"><b>等待行情資料</b><div class="muted" style="margin-top:6px">如果你看得到這張卡片，代表新版介面已經正常顯示。</div></div></div></main><script>
(function(){
'use strict';
var API='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
function el(id){return document.getElementById(id)}
function num(v){var x=Number(String(v==null?'':v).replace(/,/g,''));return isFinite(x)?x:0}
function calc(s){var p=num(s.ClosingPrice),o=num(s.OpeningPrice),h=num(s.HighestPrice),l=num(s.LowestPrice),tv=num(s.TradeValue);if(!p||!o)return null;var ch=(p-o)/o*100,pos=h>l?(p-l)/(h-l):.5;var strength=Math.round(Math.max(0,Math.min(100,50+ch*6+pos*18+Math.log(Math.max(tv,1))/Math.LN10)));var entry=Math.round(Math.max(0,Math.min(100,76-Math.max(0,ch-4)*8+(pos>.4&&pos<.9?10:0))));var state=ch>8?'不追':entry>=72?'可觀察':'等拉回';return {Code:s.Code,Name:s.Name,p:p,h:h,l:l,tv:tv,ch:ch,strength:strength,entry:entry,state:state}}
function render(data){var rows=data.map(calc).filter(function(x){return x&&x.p>=5&&x.tv>30000000}).sort(function(a,b){return (b.strength+b.entry)-(a.strength+a.entry)}).slice(0,5);var c={'可觀察':0,'等拉回':0,'不追':0};rows.forEach(function(x){c[x.state]++});el('go').textContent=c['可觀察'];el('wait').textContent=c['等拉回'];el('hot').textContent=c['不追'];if(!rows.length){el('cards').innerHTML='<div class="card">沒有符合目前篩選條件的股票。</div>';return}el('cards').innerHTML=rows.map(function(x){var cls=x.state==='可觀察'?'green':(x.state==='等拉回'?'yellow':'red');return '<article class="card"><div class="row"><div><div class="name">'+x.Code+' '+x.Name+'</div><div class="'+cls+'" style="margin-top:5px">● '+x.state+'</div></div><div><div class="price">'+x.p.toFixed(2)+'</div><div class="'+(x.ch>=0?'red':'green')+'">'+(x.ch>=0?'+':'')+x.ch.toFixed(2)+'%</div></div></div><div class="scores"><div class="score">🔥 強勢 <b style="float:right">'+x.strength+'</b></div><div class="score">🎯 進場 <b style="float:right">'+x.entry+'</b></div></div><div class="muted" style="margin-top:10px">高 '+x.h+'　低 '+x.l+'　成交值 '+(x.tv/100000000).toFixed(1)+' 億</div></article>'}).join('')}
async function update(){el('error').textContent='';el('status').textContent='正在連線臺灣證券交易所…';el('updateBtn').disabled=true;try{var r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json();if(!Array.isArray(d))throw new Error('API 回傳格式不正確');render(d);localStorage.setItem('twseRadarCache',JSON.stringify({time:Date.now(),data:d}));el('status').textContent='✓ 更新成功｜'+new Date().toLocaleString('zh-TW')+'｜取得 '+d.length+' 檔上市股票';}catch(e){el('status').textContent='⚠ 線上行情取得失敗';el('error').textContent='錯誤：'+(e&&e.message?e.message:String(e));try{var q=JSON.parse(localStorage.getItem('twseRadarCache')||'null');if(q&&q.data){render(q.data);el('status').textContent+='｜目前顯示上次成功資料 '+new Date(q.time).toLocaleString('zh-TW')}}catch(ignore){}}finally{el('updateBtn').disabled=false}}
el('updateBtn').addEventListener('click',update);
window.addEventListener('error',function(e){el('error').textContent='頁面錯誤：'+e.message});
try{var old=JSON.parse(localStorage.getItem('twseRadarCache')||'null');if(old&&old.data){render(old.data);el('status').textContent='目前顯示上次成功資料｜'+new Date(old.time).toLocaleString('zh-TW')+'｜可按更新取得最新行情'}}catch(e){}
})();
</script></body></html>
