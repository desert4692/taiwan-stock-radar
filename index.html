<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達 V3.0.2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 15px}h1,h2{margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub,.muted{color:#8ea2bd}.btn{border:0;border-radius:14px;padding:13px 17px;background:#1769e8;color:white;font-weight:800;cursor:pointer}.panel,.card{border:1px solid #26364e;background:#101a2a;border-radius:18px}.panel{padding:15px 17px;margin:17px 0}.marketline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.pill{padding:5px 9px;border-radius:999px;background:#17243a;font-size:12px}.section{margin-top:25px}.section h2{font-size:20px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.etfs{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.tag{font-size:12px;background:#1d2a3d;padding:5px 9px;border-radius:999px}.price{font-size:32px;margin:8px 0 2px}.pct{font-size:13px;color:#8ea2bd}.green{color:#63f3a8}.yellow{color:#ffd166}.red{color:#ff7b86}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}.score,.zone{background:#0b1422;border-radius:12px;padding:10px}.score b{font-size:21px}.signal{border:1px solid #314967}.zone{line-height:1.7;margin:10px 0}.tradeplan{background:#0d1928;border:1px solid #314967;border-radius:12px;padding:11px;margin:10px 0;line-height:1.8}.tradeplan b{font-size:15px}.ok{color:#63f3a8}.risk{color:#ffb36b}.reason,.summary,.metrics{font-size:13px;line-height:1.65;color:#b7c6da}.summary{color:#e8eef8;margin-top:8px}.metrics{margin-top:10px;padding-top:10px;border-top:1px solid #26364e}.empty{padding:22px;text-align:center;color:#ffd166}.foot{margin-top:25px;font-size:12px;color:#71849e}@media(max-width:850px){.grid,.etfs{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:30px}.scores{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="wrap"><div class="top"><div><h1>台股決策雷達 <span class="green" style="font-size:14px">V3.0.2</span></h1><div class="sub">全市場歷史掃描｜固定 ETF｜今日行動｜進場／停利／停損</div></div><button class="btn" id="refresh">↻ 更新畫面</button></div><div class="panel" id="status">讀取最新分析…</div>
<section class="section"><h2>📌 固定 ETF 雷達</h2><div class="sub">「訊號強度」是技術條件綜合分數，不代表上漲機率。</div><div class="grid etfs" id="etfs"></div></section>
<section class="section"><h2>🟢 今日行動標的</h2><div class="sub">同時符合強勢、進場分數與目前位於觀察區，最多 5 檔。</div><div class="grid" id="now"></div></section>

<section class="section"><h2>🌙 明日觀察標的</h2><div class="sub">收盤後挑選最多 5 檔，提供 A 拉回、B 突破與不追價三種隔日判斷；技術分數不是上漲機率。</div><div class="grid" id="tomorrow"></div></section>
<div class="foot">行情由排程資料快照提供，並非券商逐筆即時報價。技術訊號僅供研究與觀察；00685L 為槓桿型 ETF，波動與複利路徑風險較高。</div></main><script>
const $=id=>document.getElementById(id),f=n=>Number.isFinite(+n)?(+n).toLocaleString('zh-TW',{maximumFractionDigits:2}):'—',sg=n=>Number.isFinite(+n)?((+n)>=0?'+':'')+(+n).toFixed(1)+'%':'—';function cc(s){return s.includes('可觀察')?'green':s.includes('拉回')?'yellow':'red'}
function marketState(ts){const d=new Date();const day=d.getDay(),m=d.getHours()*60+d.getMinutes();if(day>=1&&day<=5&&m>=540&&m<=810)return ['🟢 盤中','green'];return ['🔴 已收盤／非交易時段','muted']}
function card(x,etf=false){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.market||''}</span></div><div class="price">${f(x.close)}</div><div class="pct">最新取得價｜當日 ${sg(x.pct)}</div><b class="${cc(x.action)}">${x.action}</b><div class="scores"><div class="score">強勢<br><b>${x.strength}</b></div><div class="score">進場<br><b>${x.entry}</b></div>${etf?`<div class="score signal">訊號<br><b>${x.signal??'—'}</b><br><span class="muted">${x.signal_label||''}</span></div>`:''}</div><div class="tradeplan"><b>📍 交易計畫</b><br>進場區：<b>${f(x.plan_entry_low??x.entry_low)} ～ ${f(x.plan_entry_high??x.entry_high)}</b><br>參考進場價：<b>${f(x.plan_entry)}</b><br><span class="green">第一停利：<b>${f(x.take_profit1)}</b></span><br><span class="green">第二停利：<b>${f(x.take_profit2)}</b></span><br><span class="red">停損／轉弱：<b>${f(x.plan_stop??x.stop)}</b></span><br>目前：<b class="${x.in_zone?'ok':'risk'}">${x.in_zone?'位於進場區':'不在進場區'}</b></div><div class="reason">優勢：${(x.reasons||[]).join('｜')||'—'}</div><div class="reason risk">風險：${(x.risks||[]).join('｜')||'目前無明顯過熱訊號'}</div><div class="summary">${x.summary||''}</div><div class="metrics">5MA ${f(x.ma5)}｜20MA ${f(x.ma20)}<br>5MA乖離 ${sg(x.bias5)}｜20MA乖離 ${sg(x.bias20)}<br>量比 ${f(x.volume_ratio)}×｜20日位置 ${f(x.pos20)}%</div></article>`}
function tomorrowCard(x){return `<article class="card"><div class="row"><b>${x.code} ${x.name}</b><span class="tag">${x.market||''}</span></div><div class="price">${f(x.close)}</div><div class="pct">今日收盤｜當日 ${sg(x.pct)}</div><b class="${(x.tomorrow_score||0)>=75?'green':'yellow'}">明日${x.tomorrow_label||'觀察'}</b><div class="scores"><div class="score">明日訊號<br><b>${x.tomorrow_score??'—'}</b></div><div class="score">強勢<br><b>${x.strength}</b></div><div class="score">進場<br><b>${x.entry}</b></div></div><div class="zone"><b>A｜拉回觀察</b>：${f(x.tomorrow_low)} ～ ${f(x.tomorrow_high)}<br><b>B｜突破觀察</b>：站上 ${f(x.breakout_price)} 且量能延續<br><b class="risk">不追價</b>：高於 ${f(x.no_chase_price)}<br><span class="green">第一停利</span>：<b>${f(x.take_profit1)}</b><br><span class="green">第二停利</span>：<b>${f(x.take_profit2)}</b><br><span class="red">停損／轉弱</span>：<b>${f(x.plan_stop??x.stop)}</b></div><div class="reason">條件：${(x.tomorrow_reasons||[]).join('｜')||'—'}</div><div class="reason risk">風險：${(x.tomorrow_risks||[]).join('｜')||'目前無明顯過熱訊號'}</div><div class="summary">${x.tomorrow_plan||''}</div></article>`}
function fill(id,a,msg,etf=false){$(id).innerHTML=(a&&a.length)?a.map(x=>card(x,etf)).join(''):`<div class="panel empty">${msg}</div>`}
function render(d){const st=marketState(d.updated_at);$('status').innerHTML=`<b>資料更新：${d.updated_at?new Date(d.updated_at).toLocaleString('zh-TW',{hour12:false}):'—'}</b><div class="marketline"><span class="pill ${st[1]}">${st[0]}</span><span class="pill">版本 ${d.version||'—'}</span><span class="pill">全市場 ${d.universe||0} 檔</span><span class="pill">完整技術分析 ${d.history_ready||0} 檔</span></div>`;fill('etfs',d.fixed_etfs,'固定 ETF 資料暫時無法取得',true);fill('now',d.action_now,'今日沒有符合「可觀察進場」條件的股票，先等待，不硬做。');const q=new Date(),qm=q.getHours()*60+q.getMinutes(),qd=q.getDay(),closed=!(qd>=1&&qd<=5&&qm>=540&&qm<=810);$('tomorrow').innerHTML=closed?((d.tomorrow_watch&&d.tomorrow_watch.length)?d.tomorrow_watch.map(tomorrowCard).join(''):'<div class="panel empty">收盤後尚無符合明日觀察條件的股票。</div>'):'<div class="panel empty">盤中持續更新；13:30 收盤後顯示明日觀察 5 檔。</div>';}
async function load(){try{$('status').textContent='正在讀取最新 V3.0.2 分析…';const r=await fetch('./analysis.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('analysis.json 尚未建立');render(await r.json())}catch(e){$('status').textContent='資料讀取失敗：'+e.message}}$('refresh').onclick=load;load();
</script></body></html>
