<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股決策雷達</title><style>body{font-family:system-ui;background:#0b1220;color:#e5e7eb;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{background:#2563eb;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700}.status,.card{background:#111827;border:1px solid #243047;border-radius:16px;padding:14px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tag{font-size:12px;padding:4px 8px;border-radius:99px;background:#1f2937}.green{color:#86efac}.yellow{color:#fde68a}.red{color:#fca5a5}.muted{color:#94a3b8;font-size:13px}h1{font-size:24px}h2{font-size:18px;margin:0 0 8px}</style></head><body><div class="wrap"><div class="top"><div><h1>台股決策雷達</h1><div class="muted">上市＋上櫃｜自動篩選 3～5 檔</div></div><button id="update" class="btn">↻ 更新行情</button></div><div id="status" class="status">正在讀取 GitHub 自動更新的行情資料…</div><div id="cards" class="grid"></div></div><script>
const $=id=>document.getElementById(id);function n(v){v=Number(v);return Number.isFinite(v)?v:null}function score(x){const c=n(x.close),o=n(x.open),h=n(x.high),l=n(x.low),val=n(x.value)||0;if(!c||!o)return null;let s=50,e=50;const day=(c-o)/o*100,range=h&&l?(h-l)/l*100:0;if(day>2)s+=18;if(day>5)s+=12;if(val>1e8)s+=10;if(val>5e8)s+=10;if(h&&c>=h*.995)s+=8;if(day>7)e-=25;else if(day>3)e-=8;else if(day>0)e+=10;if(range<6)e+=8;s=Math.max(0,Math.min(100,s));e=Math.max(0,Math.min(100,e));let state=e>=68?'可觀察進場':e>=48?'等拉回':'不追';return {...x,strength:s,entry:e,state,day};}
function render(data){const all=[...(data.twse||[]),...(data.tpex||[])].map(score).filter(x=>x&&x.close>=5&&(x.value||0)>=3e7).sort((a,b)=>(b.strength+b.entry)-(a.strength+a.entry)).slice(0,5);$('cards').innerHTML=all.map(x=>`<div class="card"><div class="top"><h2>${x.code} ${x.name}</h2><span class="tag">${x.market}</span></div><div style="font-size:28px;font-weight:800">${x.close}</div><div class="${x.state==='可觀察進場'?'green':x.state==='等拉回'?'yellow':'red'}" style="font-weight:800;margin:6px 0">${x.state}</div><div>強勢分數：${x.strength}　進場分數：${x.entry}</div><div class="muted">當日開收變化 ${x.day.toFixed(2)}%｜成交額 ${(x.value/1e8).toFixed(1)} 億</div></div>`).join('')||'<div class="status">目前沒有符合條件的股票。</div>';const err=(data.errors||[]).join('；');$('status').innerHTML=`資料更新：${data.updated_at||'未知'}<br>上市 ${data.twse?.length||0} 檔｜上櫃 ${data.tpex?.length||0} 檔${err?'<br><span class="red">資料源訊息：'+err+'</span>':''}`;}
async function load(){try{$('status').textContent='讀取最新 market.json…';const r=await fetch('./market.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('market.json 尚未建立（HTTP '+r.status+'）');render(await r.json());}catch(e){$('status').innerHTML='<span class="red">'+e.message+'</span><br>請先讓 GitHub Actions 執行一次「Update Taiwan Market Data」。';$('cards').innerHTML='';}}$('update').onclick=load;load();
</script></body></html>
