          json.dump(out,open('analysis.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          sar_out={'version':'SAR-test-1','updated_at':now.isoformat(),'settings':{'step':0.02,'max_af':0.20,'flip_days':2,'min_value':30000000,'min_volume_ratio':0.8},'candidate_count':len(sar_candidates),'top5':sar_top5}
