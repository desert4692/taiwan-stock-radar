name: V3.9.1 Intraday Day-Trade Radar
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: taiwan-stock-v391, cancel-in-progress: true}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - name: Upgrade V3.8.2 scanner to V3.9.1
        run: |
          # Keep the proven V3.8.2 scanner, but patch its confirmation/risk logic.
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          url="https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/v37-intraday-radar.yml"
          text=urllib.request.urlopen(url).read().decode()
          a=text.index("          cat > /tmp/v382.py <<'PY'")
          b=text.index("\n          PY\n          python /tmp/v382.py",a)
          body=text[a+len("          cat > /tmp/v382.py <<'PY'"):b]
          # de-indent embedded Python
          lines=body.splitlines()
          body="\n".join(x[10:] if x.startswith("          ") else x for x in lines)
          body=body.replace("startswith(('3.7','3.8'))","startswith(('3.7','3.8','3.9'))")
          body=body.replace("result={'version':'3.8.2'","result={'version':'3.9.1'")
          body=body.replace("'note':'V3.8.2：新增上市＋上櫃官方現股當沖資格硬過濾；不可當沖股票不計分、不占Top 5。其餘V3.8.1條件不變。'",
                            "'note':'V3.9.1：加強二次轉強確認、量能持續確認，並把綠燈停損風險限制在3%內。'")
          # Require actual upward turn and non-decreasing cumulative volume vs prior Top5 observation when available.
          body=body.replace(
            "pull_confirm=pull_price_ok and pc is not None and c>=pc*.999",
            "pvol=n(pv.get('volume')); rising=(pc is not None and c>=pc*1.001); vol_ok=(pvol is None or (x.get('volume') or 0)>=pvol); pull_confirm=pull_price_ok and rising and vol_ok and pos>=.65")
          body=body.replace(
            "break_confirm=old_break is not None and c>=old_break*1.003 and c>=op",
            "pvol=n(pv.get('volume')); vol_ok=(pvol is None or (x.get('volume') or 0)>=pvol); break_confirm=old_break is not None and c>=old_break*1.003 and c>=op and vol_ok and pos>=.75")
          # Cap structural stop at max 3% risk for intraday use.
          body=body.replace(
            "pull_stop=min(support*.995,pull_entry*.975)",
            "pull_stop=max(min(support*.995,pull_entry*.992),pull_entry*.97)")
          body=body.replace(
            "br_stop=max(support,br_entry*.975)",
            "br_stop=max(support,br_entry*.975,br_entry*.97)")
          # Persist volume in candidate output for next-scan confirmation.
          body=body.replace(
            "'entry_confirmed':bool(green_pull or green_break),'raw_time':x['raw_time']})",
            "'entry_confirmed':bool(green_pull or green_break),'volume':x.get('volume'),'raw_time':x['raw_time']})")
          body=body.replace("if green_pull:status='🟢 拉回止穩確認'","if green_pull:status='🟢 拉回轉強確認'")
          body=body.replace("elif green_break:status='🟢 突破確認'","elif green_break:status='🟢 突破站穩確認'")
          Path("/tmp/v391.py").write_text(body)
          PY
          python /tmp/v391.py
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v37-intraday.json /tmp/v37.json
          git fetch origin main; git reset --hard origin/main
          cp /tmp/v37.json v37-intraday.json; git add v37-intraday.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.9.1 day-trade radar"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main; git reset --hard origin/main
            cp /tmp/v37.json v37-intraday.json; git add v37-intraday.json
            git diff --cached --quiet || git commit -m "Update V3.9.1 day-trade radar"
            sleep $((i*2))
          done
          exit 1
