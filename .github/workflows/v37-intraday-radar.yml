name: V3.9.6.1 Intraday Day-Trade Radar
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: taiwan-stock-v3961, cancel-in-progress: true}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - name: V3.9.6.1 scan
        run: |
          cat > /tmp/v3961.py <<'PY'
          import requests,json,datetime,time,re
          from bs4 import BeautifulSoup
          TZ=datetime.timezone(datetime.timedelta(hours=8)); now=datetime.datetime.now(TZ)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153 Safari/537.36','Referer':'https://mis.twse.com.tw/stock/index.jsp'})
          def n(v):
            try:
              s=str(v).replace(',','').replace('+','').strip()
              return None if s in ('','-','--','---','None') else float(s)
            except:return None
          errors=[]; meta={}; ma5_diag={}
          try:
            m=json.load(open('market.json',encoding='utf8'))
            for market,key in [('上市','twse'),('上櫃','tpex')]:
              for x in m.get(key,[]) or []:
                c=str(x.get('code',''))
                if re.fullmatch(r'\d{4}',c): meta[c]={'name':x.get('name',c),'market':market}
          except: pass
          if len(meta)<1500:
            for back in range(10):
              d=now.date()-datetime.timedelta(days=back)
              if d.weekday()>=5: continue
              try:
                j=S.get('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX',params={'date':d.strftime('%Y%m%d'),'type':'ALL','response':'json'},timeout=35).json()
                for tb in j.get('tables') or []:
                  for r in tb.get('data') or []:
                    if isinstance(r,list) and len(r)>=2 and re.fullmatch(r'\d{4}',str(r[0]).strip()):
                      c=str(r[0]).strip(); meta[c]={'name':str(r[1]).strip(),'market':'上市'}
                if len(meta)>800: break
              except Exception as e: errors.append('TWSE universe '+repr(e))
            for back in range(10):
              d=now.date()-datetime.timedelta(days=back)
              if d.weekday()>=5: continue
              try:
                roc=f'{d.year-1911}/{d.month:02d}/{d.day:02d}'
                r=S.get('https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php',params={'l':'zh-tw','o':'htm','d':roc},timeout=30)
                t=BeautifulSoup(r.text,'lxml').find('table')
                if t:
                  for tr in t.find_all('tr'):
                    z=[x.get_text(' ',strip=True) for x in tr.find_all('td')]
                    if len(z)>=2 and re.fullmatch(r'\d{4}',z[0]): meta[z[0]]={'name':z[1],'market':'上櫃'}
                if sum(v['market']=='上櫃' for v in meta.values())>500: break
              except Exception as e: errors.append('TPEx universe '+repr(e))
          syms=[('tse' if m['market']=='上市' else 'otc')+'_'+c+'.tw' for c,m in meta.items()]
          rows=[]
          for i in range(0,len(syms),60):
            for attempt in range(3):
              try:
                r=S.get('https://mis.twse.com.tw/stock/api/getStockInfo.jsp',params={'ex_ch':'|'.join(syms[i:i+60]),'json':'1','delay':'0','_':str(int(time.time()*1000))},timeout=25)
                r.raise_for_status(); rows+=r.json().get('msgArray') or []; break
              except Exception as e:
                if attempt==2: errors.append('MIS '+repr(e))
                time.sleep(attempt+1)
          try:
            a=json.load(open('analysis.json',encoding='utf8'))
          except:a={}
          hist={}
          for k in ('action_now','tomorrow_watch'):
            for x in a.get(k,[]) or []: hist[str(x.get('code'))]=x
          try:
            old=json.load(open('v37-intraday.json',encoding='utf8')); prev={str(x.get('code')):x for x in old.get('opportunities',[]) or []}
          except: prev={}
          def collect(d):
            o=set()
            if isinstance(d,list):
              for x in d:o|=collect(x)
            elif isinstance(d,dict):
              for k,v in d.items():
                if any(w in str(k).lower() for w in ('code','證券代號','股票代號','代號')):
                  c=str(v).strip()
                  if re.fullmatch(r'\d{4}',c):o.add(c)
              for v in d.values():
                if isinstance(v,(dict,list)):o|=collect(v)
            return o
          day=set(); otc=set()
          try:
            r=S.get('https://openapi.twse.com.tw/v1/exchangeReport/TWTB4U',timeout=30);r.raise_for_status();day|=collect(r.json())
          except Exception as e:errors.append('TWSE daytrade '+repr(e))
          for attempt in range(4):
            try:
              r=S.get('https://www.tpex.org.tw/openapi/v1/tpex_securities',timeout=30);r.raise_for_status();otc|=collect(r.json())
              if len(otc)>=100:break
            except Exception as e:
              if attempt==3:errors.append('TPEx daytrade '+repr(e))
              time.sleep(2*(attempt+1))
          fallback=False
          try:
            cache=json.load(open('v392-daytrade-cache.json',encoding='utf8'))
            cd=datetime.date.fromisoformat(str(cache.get('updated_at'))[:10]); co=set(map(str,cache.get('tpex_codes',[])))
          except: cd=None;co=set()
          if len(otc)<100 and co and cd and (now.date()-cd).days<=7:otc=co;fallback=True
          if len(otc)>=100:
            json.dump({'updated_at':now.isoformat(),'tpex_codes':sorted(otc)},open('v392-daytrade-cache.json','w'),ensure_ascii=False)
          day|=otc; feed=len(day)>=1400
          q=[]
          for z in rows:
            code=str(z.get('c') or '');c=n(z.get('z'));ref=n(z.get('y'))
            if not re.fullmatch(r'\d{4}',code) or c is None or not ref or not feed or code not in day:continue
            op=n(z.get('o'));hi=n(z.get('h'));lo=n(z.get('l'));vol=n(z.get('v')) or 0
            if not (z.get('t') or op or hi or lo or vol):continue
            q.append({'code':code,'name':z.get('n') or meta.get(code,{}).get('name',code),'market':meta.get(code,{}).get('market'),'close':c,'reference':ref,'open':op,'high':hi,'low':lo,'volume':vol,'pct':(c/ref-1)*100,'raw_time':z.get('t')})
          ps=sorted(x['pct'] for x in q)
          def rank(v):return 100*sum(z<=v for z in ps)/len(ps) if ps else 50
          def ma5(code,market):
            vals=[]; diag={'market':market,'months':[]}
            for moff in range(3):
              y=now.year;m=now.month-moff
              while m<=0:y-=1;m+=12
              try:
                if market=='上市':
                  j=S.get('https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY',params={'date':f'{y}{m:02d}01','stockNo':code,'response':'json'},timeout=20).json()
                  for r in j.get('data') or []:
                    if len(r)>6 and n(r[6]) is not None:vals.append(n(r[6]))
                else:
                  roc=f'{y-1911}/{m:02d}/01'
                  rr=S.get('https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock',
                    params={'code':code,'date':roc,'response':'html'},timeout=25)
                  rr.raise_for_status()
                  soup=BeautifulSoup(rr.text,'lxml')
                  before=len(vals); matched_rows=0
                  # Official TPEx table has 9 columns:
                  # 日期、成交仟股、成交仟元、開盤、最高、最低、收盤、漲跌、筆數.
                  # Header cells may use td rather than th, so detect rows by ROC date
                  # and read column 7 (index 6) directly.
                  for tr in soup.find_all('tr'):
                    cells=[td.get_text(' ',strip=True) for td in tr.find_all(['td','th'])]
                    if len(cells)>=7 and re.fullmatch(r'\d{2,3}/\d{2}/\d{2}',cells[0]):
                      matched_rows+=1
                      v=n(cells[6])
                      if v is not None: vals.append(v)
                  diag['months'].append({'roc':roc,'http':rr.status_code,'html_bytes':len(rr.text),'matched_rows':matched_rows,'close_values':len(vals)-before})
              except Exception as e:
                errors.append(f'MA5 {code} '+repr(e))
                diag['months'].append({'error':repr(e)})
              if len(vals)>=5:break
            diag['values_found']=len(vals)
            diag['last5']=vals[-5:] if vals else []
            ma5_diag[code]=diag
            return sum(vals[-5:])/5 if len(vals)>=5 else None
          pre=[]
          for x in q:
            c=x['close'];hi=x['high'] or c;lo=x['low'] or c;pos=(c-lo)/(hi-lo) if hi>lo else .5
            if c>=5 and 1.5<=x['pct']<=8 and pos>=.6 and rank(x['pct'])>=70:pre.append(x)
          pre=sorted(pre,key=lambda x:rank(x['pct']),reverse=True)[:35]
          mc={}
          for x in pre:
            v=n(hist.get(x['code'],{}).get('ma5'))
            if v is None:v=ma5(x['code'],x['market']);time.sleep(.08)
            if v:mc[x['code']]=v
          out=[]
          for x in q:
            c=x['close'];pct=x['pct'];hi=x['high'] or c;lo=x['low'] or c;op=x['open'] or c
            if c<5 or not 1.5<=pct<=8:continue
            pos=(c-lo)/(hi-lo) if hi>lo else .5;rs=rank(pct)
            if pos<.6 or rs<70:continue
            h=hist.get(x['code'],{});m=mc.get(x['code']) or n(h.get('ma5'));bias=(c/m-1)*100 if m else None
            if bias is not None and bias>7:continue
            mom=n(h.get('momentum_score') or h.get('strength')) or 50;ent=n(h.get('entry')) or 50;heat=n(h.get('sector_heat')) or 0
            impulse=50+(10 if pct>=2 else 0)+(8 if pct>=3 else 0)+(8 if c>=op else 0)+(10 if pos>=.7 else 0)
            score=impulse*.35+rs*.30+mom*.15+ent*.10+heat*.10-(12 if pct>=6 else 0)-(10 if bias is not None and bias>5 else 0)
            score=round(max(0,min(100,score)))
            if score<68:continue
            dd=(hi-c)/hi*100;pl=hi*.97;ph=hi*.99;support=max(lo,m*.995 if m else lo)
            pv=prev.get(x['code'],{});pc=n(pv.get('close'));pvol=n(pv.get('volume'));volok=pvol is None or x['volume']>=pvol
            pull=1<=dd<=3 and c>=support;pullok=pull and pc is not None and c>=pc*1.001 and volok and pos>=.65
            oldb=n(pv.get('breakout_entry'));blevel=oldb if oldb else hi*1.003
            brok=oldb is not None and c>=oldb*1.003 and c>=op and volok and pos>=.75
            pe=c if pullok else (pl+ph)/2;stop=max(support*.995,pe*.97);risk=max(.01,pe-stop);tp1=pe+1.5*risk;tp2=pe+2.5*risk
            be=c if brok else blevel;bstop=max(support,be*.975);brisk=max(.01,be-bstop);bt1=be+1.5*brisk;bt2=be+2.5*brisk;nochase=be*1.018
            greenp=pullok and (pe-stop)/pe*100<=3;greenb=brok and c<=nochase and (be-bstop)/be*100<=3
            status='🟢 拉回轉強確認' if greenp else '🟢 突破站穩確認' if greenb else '🟡 拉回區等待轉強' if pull else '🟡 強勢但等拉回／突破' if dd<1 else '🟡 等待進場條件'
            out.append({'code':x['code'],'name':x['name'],'market':x['market'],'close':round(c,2),'pct':round(pct,2),'score':score,'status':status,'relative_strength':round(rs),'intraday_position':round(pos*100,1),'drawdown_from_high':round(dd,2),'ma5':round(m,2) if m else None,'bias5':round(bias,2) if bias is not None else None,'volume':x['volume'],'pullback_entry':[round(pl,2),round(ph,2)],'pullback_condition':'高點回檔1～3%＋下一輪重新上漲0.1%以上＋量能持續','breakout_entry':round(blevel,2),'breakout_condition':'突破前次盤中高點約0.3%＋高檔站穩＋量能持續','no_chase':round(nochase,2),'stop':round(stop,2),'stop_condition':'短線防守價；綠燈風險限制3%內','take_profit1':round(tp1,2),'take_profit2':round(tp2,2),'rr':1.5,'risk_pct':round((pe-stop)/pe*100,2),'breakout_stop':round(bstop,2),'breakout_tp1':round(bt1,2),'breakout_tp2':round(bt2,2),'breakout_rr':1.5,'breakout_risk_pct':round((be-bstop)/be*100,2),'entry_confirmed':bool(greenp or greenb),'raw_time':x['raw_time']})
          out=sorted(out,key=lambda x:(x['entry_confirmed'],x['score'],x['relative_strength']),reverse=True)[:5]
          result={'version':'3.9.5','updated_at':now.isoformat(),'trade_date':now.strftime('%Y-%m-%d'),'source':'TWSE MIS + official daily MA5','universe_size':len(meta),'received_quotes':len(rows),'daytrade_eligible_count':len(day),'daytrade_feed_ok':feed,'tpex_daytrade_live_count':len(otc),'tpex_daytrade_fallback_used':fallback,'valid_live_quotes':len(q),'scanned':len(q),'ma5_completed_count':sum(x.get('ma5') is not None for x in out),'opportunities':out,'ma5_diagnostics':ma5_diag,'market_errors':errors[:15],'note':'V3.9.6.1：加入TPEx MA5診斷資訊並修正輸出版本標記；交易篩選、當沖資格、進場與風控邏輯不變。'}
          json.dump(result,open('v37-intraday.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          python /tmp/v3961.py
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v37-intraday.json /tmp/v37.json
          [ -f v392-daytrade-cache.json ] && cp v392-daytrade-cache.json /tmp/cache.json || true
          git fetch origin main; git reset --hard origin/main
          cp /tmp/v37.json v37-intraday.json
          [ -f /tmp/cache.json ] && cp /tmp/cache.json v392-daytrade-cache.json || true
          git add v37-intraday.json
          [ -f v392-daytrade-cache.json ] && git add v392-daytrade-cache.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.9.6.1 day-trade radar"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main; git reset --hard origin/main
            cp /tmp/v37.json v37-intraday.json
            [ -f /tmp/cache.json ] && cp /tmp/cache.json v392-daytrade-cache.json || true
            git add v37-intraday.json
            [ -f v392-daytrade-cache.json ] && git add v392-daytrade-cache.json || true
            git diff --cached --quiet || git commit -m "Update V3.9.6.1 day-trade radar"
            sleep $((i*2))
          done
          exit 1
