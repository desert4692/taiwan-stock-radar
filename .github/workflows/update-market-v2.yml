      - name: Commit V3.2 data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp analysis.json /tmp/analysis-v32.json

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/analysis-v32.json analysis.json

          git add analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.2 short-term capital radar"

          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict. Retry $i..."
            cp analysis.json /tmp/analysis-v32.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/analysis-v32.json analysis.json
            git add analysis.json
            if ! git diff --cached --quiet; then
              git commit -m "Update V3.2 short-term capital radar"
            fi
            sleep $((i * 2))
          done

          echo "Unable to push V3.2 analysis after retries."
          exit 1
