name: Update Taiwan Market Data V2
on:
  workflow_dispatch:
  schedule:
    - cron: '10,40 1-5 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Build V2.2 analysis
        run: |
          cat > /tmp/v2.py <<'PY'
          import requests,json,re,datetime,time
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 TaiwanStockRadar/2.2'}
          TZ=datetime.timezone(datetime.timedelta(hours=8)); now=datetime.datetime.now(TZ)
          def num(v):
            try:return float(str(v).replace(',','').replace('+','').strip())
            except:return None
          def sma(a,n): return sum(a[-n:])/n if len(a)>=n else None
          try: market=json.load(open('market.json',encoding='utf8'))
          except: market={'twse':[],'tpex':[]}
          universe=[x for x in market.get('twse',[])+market.get('tpex',[]) if x.get('close') and x.get('value') and re.fullmatch(r'\d{4}',str(x.get('code','')))]
          for x in universe:
            ch=x.get('change') or 0; prev=x['close']-ch
            x['_pct']=ch/prev*100 if prev else 0
            x['_pre']=min(12,max(-5,x['_pct']))*5+min(30,(x.get('value') or 0)/1e8)
          cand=sorted([x for x in universe if x['close']>=5 and x['value']>=3e7 and x['_pct']>-1],key=lambda x:x['_pre'],reverse=True)[:70]
          def months2():
            cur=now.replace(day=1); prev=(cur-datetime.timedelta(days=1)).replace(day=1)
            return [prev,cur]
          def twse_hist(code):
            rows=[]; u='https://www.twse.com.tw/exchangeReport/STOCK_DAY'
            for m in months2():
              j=requests.get(u,params={'response':'json','date':m.strftime('%Y%m%d'),'stockNo':code},headers=H,timeout=25).json()
              for z in j.get('data',[]):
                if len(z)>=9 and num(z[6]) is not None: rows.append({'close':num(z[6]),'high':num(z[4]),'low':num(z[5]),'volume':num(z[1])})
              time.sleep(.04)
            return rows
          def tpex_hist(code):
            rows=[]; u='https://www.tpex.org.tw/web/stock/aftertrading/daily_trading_info/st43_result.php'
            for m in months2():
              d=f'{m.year-1911}/{m.month:02d}'; r=requests.get(u,params={'l':'zh-tw','d':d,'stkno':code},headers=H,timeout=25)
              try:
                data=r.json().get('aaData') or r.json().get('data') or []
                for z in data:
                  if isinstance(z,list) and len(z)>=9 and num(z[6]) is not None: rows.append({'close':num(z[6]),'high':num(z[4]),'low':num(z[5]),'volume':num(z[1])})
              except:
                s=BeautifulSoup(r.text,'lxml')
                for tr in s.select('tr'):
                  z=[q.get_text(strip=True) for q in tr.select('td')]
                  if len(z)>=9 and num(z[6]) is not None: rows.append({'close':num(z[6]),'high':num(z[4]),'low':num(z[5]),'volume':num(z[1])})
              time.sleep(.04)
            return rows
          picks=[]; ready=0
          for x in cand:
            try: hist=twse_hist(x['code']) if x['market']=='上市' else tpex_hist(x['code'])
            except: hist=[]
            if not hist or abs(hist[-1]['close']-x['close'])>1e-9:
              hist.append({'close':x['close'],'high':x.get('high') or x['close'],'low':x.get('low') or x['close'],'volume':x.get('volume') or 0})
            c=[z['close'] for z in hist if z.get('close')]; v=[z.get('volume') or 0 for z in hist if z.get('close')]
            ma5=sma(c,5); ma20=sma(c,20)
            avgvol5=sum(v[-6:-1])/5 if len(v)>=6 else None
            avgvol20=sum(v[-21:-1])/20 if len(v)>=21 else None
            vr=v[-1]/avgvol5 if avgvol5 else None
            h20=max(c[-20:]) if len(c)>=20 else max(c); l20=min(c[-20:]) if len(c)>=20 else min(c)
            pos=(x['close']-l20)/(h20-l20)*100 if h20>l20 else 50
            bias5=(x['close']/ma5-1)*100 if ma5 else None
            bias20=(x['close']/ma20-1)*100 if ma20 else None
            prev20=max(c[-21:-1]) if len(c)>=21 else None
            breakout=bool(prev20 and x['close']>=prev20)
            strength=40; reasons=[]; risks=[]
            if ma5 and x['close']>ma5: strength+=12; reasons.append('站上5MA')
            if ma20 and x['close']>ma20: strength+=15; reasons.append('站上20MA')
            if ma5 and ma20 and ma5>ma20: strength+=12; reasons.append('短均線多頭')
            if vr and vr>=1.5: strength+=12; reasons.append(f'量比{vr:.1f}×')
            if breakout: strength+=12; reasons.append('突破20日高')
            if x['_pct']>2: strength+=7; reasons.append('當日動能偏強')
            strength=max(0,min(100,round(strength)))
            entry=55
            if bias5 is not None:
              if -1<=bias5<=3.5: entry+=18; reasons.append('貼近5MA')
              elif bias5<=6: entry+=8
              elif bias5>10: entry-=22; risks.append('距5MA過遠')
              elif bias5>7: entry-=12; risks.append('5MA乖離偏大')
            if bias20 is not None:
              if 0<=bias20<=8: entry+=12
              elif bias20>15: entry-=22; risks.append('20MA乖離過大')
              elif bias20>10: entry-=10; risks.append('20MA乖離偏大')
            if vr:
              if 1.1<=vr<=3.0: entry+=8
              elif vr>5: entry-=12; risks.append('爆量過熱')
              elif vr>3.5: entry-=6; risks.append('量能偏熱')
            if pos>=98:
              entry-=10; risks.append('位於20日高檔')
            if x['_pct']>=9:
              entry-=20; risks.append('單日漲幅過大')
            elif x['_pct']>=6:
              entry-=10; risks.append('短線漲幅偏大')
            if breakout and bias5 is not None and bias5<=5 and x['_pct']<6: entry+=8
            entry=max(0,min(100,round(entry)))
            if len(c)>=20: ready+=1
            in_zone=False
            base=ma5 or x['close']
            entry_low=base*0.99; entry_high=base*1.025
            if entry_low<=x['close']<=entry_high: in_zone=True
            lows=[z.get('low') for z in hist[-10:] if z.get('low')]
            stop=min(lows) if lows else min(c[-10:])
            if len(c)<20: action='資料不足'
            elif strength>=72 and entry>=72 and in_zone: action='可觀察進場'
            elif strength>=65 and entry>=45: action='等拉回'
            else: action='不追'
            if action=='可觀察進場': summary='趨勢與量能偏強，且目前價格接近技術觀察區。'
            elif action=='等拉回': summary='趨勢仍偏強，但目前位置不適合追價，等待靠近觀察區。'
            else: summary='目前風險報酬條件較差，先不追價。'
            picks.append({**{k:x.get(k) for k in ('code','name','market','close')},'pct':x['_pct'],'strength':strength,'entry':entry,'action':action,'ma5':ma5,'ma20':ma20,'bias5':bias5,'bias20':bias20,'avgvol5':avgvol5,'avgvol20':avgvol20,'volume_ratio':vr,'pos20':pos,'breakout20':breakout,'entry_low':entry_low,'entry_high':entry_high,'in_zone':in_zone,'stop':stop,'reasons':reasons[:6],'risks':risks[:5],'summary':summary,'hist_days':len(c)})
            time.sleep(.08)
          eligible=[z for z in picks if z['hist_days']>=20]
          picks=sorted(eligible,key=lambda z:(z['strength']*.55+z['entry']*.45,z['entry']),reverse=True)[:5]
          out={'version':'2.2','updated_at':now.isoformat(),'universe':len(universe),'history_ready':ready,'picks':picks,'note':'' if ready else '歷史行情尚未完整取得。'}
          json.dump(out,open('analysis.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python /tmp/v2.py
      - name: Commit V2.2 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V2.2 analysis"
          git push
