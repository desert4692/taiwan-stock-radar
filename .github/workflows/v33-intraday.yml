name: V3.3.2 Intraday Auto Tracker

on:
  workflow_dispatch:
  schedule:
    # Taiwan weekdays 09:00-13:30, every 5 minutes
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 1-4 * * 1-5'
    - cron: '0,5,10,15,20,25,30 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-stock-v33-intraday
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Refresh quotes and track locked stocks
        run: |
          cat > /tmp/v33.py <<'PY'
          import json,re,datetime,requests
          from bs4 import BeautifulSoup
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          now=datetime.datetime.now(TZ)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 TaiwanStockRadar/3.3.2'})
          def num(v):
              try:
                  s=str(v).replace(',','').replace('+','').strip()
                  if s in ('','---','--','--.--','None'):return None
                  return float(s)
              except:return None

          market={'updated_at':now.isoformat(),'quote_date':now.strftime('%Y-%m-%d'),'twse':[],'tpex':[],'errors':[]}
          try:
              j=S.get('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX',
                params={'date':now.strftime('%Y%m%d'),'type':'ALL','response':'json'},timeout=40).json()
              found={}
              for tb in j.get('tables') or []:
                  for row in tb.get('data') or []:
                      if not isinstance(row,list) or len(row)<11:continue
                      code=str(row[0]).strip().upper()
                      if not re.fullmatch(r'[0-9]{4,6}[A-Z]?',code):continue
                      close=num(row[8])
                      if close is None:continue
                      sign=str(row[9]);ch=num(row[10])
                      if ch is not None and ('-' in sign or 'green' in sign.lower()):ch=-abs(ch)
                      found[code]={'code':code,'name':str(row[1]).strip(),'market':'上市','volume':num(row[2]),
                        'value':num(row[4]),'open':num(row[5]),'high':num(row[6]),'low':num(row[7]),'close':close,'change':ch}
              market['twse']=list(found.values())
          except Exception as e:market['errors'].append('TWSE '+repr(e))

          try:
              r=S.get('https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&o=htm',timeout=30)
              table=BeautifulSoup(r.text,'lxml').find('table')
              if table:
                  for tr in table.find_all('tr'):
                      td=[c.get_text(' ',strip=True) for c in tr.find_all('td')]
                      if len(td)<10:continue
                      code=td[0].strip().upper()
                      if not re.fullmatch(r'[0-9]{4,6}[A-Z]?',code):continue
                      market['tpex'].append({'code':code,'name':td[1],'market':'上櫃','close':num(td[2]),'change':num(td[3]),
                        'open':num(td[4]),'high':num(td[5]),'low':num(td[6]),'volume':num(td[8]),'value':num(td[9])})
          except Exception as e:market['errors'].append('TPEx '+repr(e))

          latest={x['code']:x for x in market['twse']+market['tpex']}
          try:base=json.load(open('analysis.json',encoding='utf8'))
          except:base={}
          try:state=json.load(open('v33-state.json',encoding='utf8'))
          except:state={}

          today=now.strftime('%Y-%m-%d')
          if state.get('trade_date')!=today:
              locked=[]
              for x in (base.get('tomorrow_watch') or [])[:5]:
                  q=dict(x);q['locked_at']=now.isoformat();q['locked_from']='前一交易日收盤分析'
                  locked.append(q)
              state={'version':'3.3.2','trade_date':today,'locked_at':now.isoformat(),'locked_watch':locked}

          def live(x):
              z=dict(x);q=latest.get(str(z.get('code')),{})
              c=num(q.get('close'))
              if c is not None:
                  z['close']=c;ch=num(q.get('change')) or 0;prev=c-ch
                  z['pct']=ch/prev*100 if prev else 0
                  z['current_volume']=num(q.get('volume'));z['current_value']=num(q.get('value'))
              c=num(z.get('close'));lo=num(z.get('plan_entry_low') or z.get('entry_low'))
              hi=num(z.get('plan_entry_high') or z.get('entry_high'));bp=num(z.get('breakout_price'))
              nc=num(z.get('no_chase_price'));stop=num(z.get('plan_stop') or z.get('stop'))
              if c is None:st='等待行情'
              elif stop and c<=stop:st='🔴 跌破轉弱'
              elif nc and c>nc:st='🔴 超過不追價'
              elif lo and hi and lo<=c<=hi:st='🟢 進入觀察進場區'
              elif bp and c>=bp:st='🟢 突破確認'
              elif lo and c<lo:st='🟡 等待轉強'
              else:st='🟡 等拉回'
              z['live_status']=st;z['live_updated_at']=now.isoformat()
              return z

          locked=[live(x) for x in state.get('locked_watch',[])]
          locked_codes={str(x.get('code')) for x in locked}
          # V3.3.2: current-market opportunity scan. This does not replace locked stocks.
          # Uses fresh price/value/volume plus sector/baseline data already calculated by the heavy analysis.
          pool={}
          for x in (base.get('action_now') or [])+(base.get('tomorrow_watch') or []):
              pool[str(x.get('code'))]=x
          hotmap={x.get('sector'):x.get('heat',0) for x in (base.get('hot_sectors') or [])}
          # Baseline lookup from known cards; fresh market scan also admits large-money movers even if not in yesterday's Top 5.
          opp=[]
          for code,q in latest.items():
              if code in locked_codes or not re.fullmatch(r'\\d{4}',code):continue
              c=num(q.get('close')); ch=num(q.get('change')) or 0; val=num(q.get('value')) or 0; vol=num(q.get('volume')) or 0
              if not c or c<5 or val<100000000:continue
              prev=c-ch
              pct=ch/prev*100 if prev else 0
              if pct<2.0:continue
              b=pool.get(code,{})
              sector=b.get('sector','盤中資金流')
              heat=hotmap.get(sector,b.get('sector_heat',0) or 0)
              # Current-day money-flow score: liquidity 35, price momentum 30, sector heat 20, breakout/baseline 15.
              money=min(100,val/1000000000*20)
              pscore=100 if 3<=pct<8 else 80 if 2<=pct<3 else 65 if 8<=pct<=9.8 else 35
              base_strength=b.get('momentum_score') or b.get('strength') or 50
              score=round(money*.35+pscore*.30+min(100,heat)*.20+min(100,base_strength)*.15)
              if score<60:continue
              z=dict(b)
              z.update({'code':code,'name':q.get('name') or b.get('name') or code,'market':q.get('market'),
                        'sector':sector,'close':c,'pct':pct,'current_volume':vol,'current_value':val,
                        'momentum_score':score,'sector_heat':heat,'intraday_score':score})
              if not z.get('entry'): z['entry']=max(35,min(85,round(80-abs(pct-4)*6)))
              z=live(z); z['live_status']='⚡ 盤中資金轉強｜'+z['live_status'].replace('🟢 ','').replace('🟡 ','').replace('🔴 ','')
              opp.append(z)
          opp=sorted(opp,key=lambda z:(z.get('intraday_score',0),z.get('current_value',0)),reverse=True)[:5]
          state['locked_watch']=locked;state['intraday_opportunities']=opp;state['updated_at']=now.isoformat()
          state['market_errors']=market['errors']
          with open('market.json','w',encoding='utf8') as f:json.dump(market,f,ensure_ascii=False,separators=(',',':'))
          with open('v33-state.json','w',encoding='utf8') as f:json.dump(state,f,ensure_ascii=False,separators=(',',':'))
          print('locked',[(x.get('code'),x.get('live_status')) for x in locked])
          print('opportunities',[x.get('code') for x in opp])
          PY
          python /tmp/v33.py
      - name: Commit V3.3 live state safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp market.json /tmp/market-v33.json
          cp v33-state.json /tmp/state-v33.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market-v33.json market.json
          cp /tmp/state-v33.json v33-state.json
          git add market.json v33-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.3 intraday tracker"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/market-v33.json market.json
            cp /tmp/state-v33.json v33-state.json
            git add market.json v33-state.json
            git diff --cached --quiet || git commit -m "Update V3.3 intraday tracker"
            sleep $((i*2))
          done
          exit 1
