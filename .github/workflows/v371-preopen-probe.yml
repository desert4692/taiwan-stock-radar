name: V3.7.1 Preopen Auction Probe

on:
  workflow_dispatch:
  schedule:
    # Taiwan weekdays 08:30-08:59. GitHub cron is UTC.
    - cron: '30,35,40,45,50,55 0 * * 1-5'
    - cron: '58 0 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-stock-v371-preopen
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe TWSE MIS preopen data
        run: |
          pip install requests
          cat > /tmp/v371.py <<'PY'
          import requests,json,datetime,time,re,os

          TZ=datetime.timezone(datetime.timedelta(hours=8))
          now=datetime.datetime.now(TZ)
          S=requests.Session()
          S.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://mis.twse.com.tw/stock/index.jsp',
            'Accept':'application/json,text/plain,*/*'
          })

          def num(v):
            try:
              s=str(v).replace(',','').strip()
              if s in ('','-','--','---','None'): return None
              return float(s)
            except:return None

          # Seed symbols from yesterday's market.json so we can batch-query the MIS endpoint.
          try:
            old=json.load(open('market.json',encoding='utf8'))
          except:
            old={'twse':[],'tpex':[]}

          symbols=[]
          meta={}
          for x in old.get('twse',[]):
            c=str(x.get('code','')).strip()
            if re.fullmatch(r'\d{4}',c):
              symbols.append('tse_'+c+'.tw')
              meta[c]={'code':c,'name':x.get('name',c),'market':'上市','prev_close':num(x.get('close'))}
          for x in old.get('tpex',[]):
            c=str(x.get('code','')).strip()
            if re.fullmatch(r'\d{4}',c):
              symbols.append('otc_'+c+'.tw')
              meta[c]={'code':c,'name':x.get('name',c),'market':'上櫃','prev_close':num(x.get('close'))}

          def chunks(a,n):
            for i in range(0,len(a),n): yield a[i:i+n]

          rows=[]
          errors=[]
          url='https://mis.twse.com.tw/stock/api/getStockInfo.jsp'

          # MIS may throttle very large requests, so use modest batches + retries.
          for batch in chunks(symbols,80):
            ok=False
            for attempt in range(3):
              try:
                r=S.get(url,params={
                  'ex_ch':'|'.join(batch),
                  'json':'1',
                  'delay':'0',
                  '_':str(int(time.time()*1000))
                },timeout=25)
                r.raise_for_status()
                j=r.json()
                data=j.get('msgArray') or []
                if data:
                  rows.extend(data)
                ok=True
                break
              except Exception as e:
                if attempt==2: errors.append(repr(e))
                time.sleep(1.5*(attempt+1))
            time.sleep(.15)

          parsed=[]
          for z in rows:
            code=str(z.get('c') or '').strip()
            if not re.fullmatch(r'\d{4}',code):continue
            m=meta.get(code,{})
            ref=num(z.get('y')) or m.get('prev_close')
            # z is latest/estimated displayed price in MIS; during preopen it is used only as a probe,
            # not treated as an executable trade price.
            px=num(z.get('z'))
            if px is None:
              # Some preopen responses may expose best bid/ask but no last/estimated z.
              bids=[num(x) for x in str(z.get('b') or '').split('_') if num(x) is not None]
              asks=[num(x) for x in str(z.get('a') or '').split('_') if num(x) is not None]
              if bids and asks: px=(bids[0]+asks[0])/2
              elif bids:px=bids[0]
              elif asks:px=asks[0]
            pct=(px/ref-1)*100 if px is not None and ref else None

            bids=[num(x) for x in str(z.get('b') or '').split('_') if num(x) is not None]
            asks=[num(x) for x in str(z.get('a') or '').split('_') if num(x) is not None]
            bidv=[num(x) or 0 for x in str(z.get('g') or '').split('_') if str(x).strip()!='']
            askv=[num(x) or 0 for x in str(z.get('f') or '').split('_') if str(x).strip()!='']
            bsum=sum(bidv[:5]); asum=sum(askv[:5])
            imbalance=(bsum-asum)/(bsum+asum)*100 if bsum+asum else 0

            parsed.append({
              'code':code,'name':z.get('n') or m.get('name') or code,
              'market':m.get('market'),'reference':ref,'probe_price':px,
              'probe_pct':round(pct,2) if pct is not None else None,
              'best_bid':bids[0] if bids else None,'best_ask':asks[0] if asks else None,
              'bid5_volume':bsum,'ask5_volume':asum,'imbalance':round(imbalance,1),
              'raw_time':z.get('t'),'raw_date':z.get('d')
            })

          # Keep a short history across scheduled runs to test persistence, not just one snapshot.
          try:
            prev=json.load(open('v371-preopen.json',encoding='utf8'))
            history=prev.get('history',[])
          except:
            history=[]

          snap={'at':now.isoformat(),'count':len(parsed),
                'quotes':[{k:x.get(k) for k in ('code','probe_price','probe_pct','imbalance')} for x in parsed]}
          history=(history+[snap])[-8:]

          # Candidate score: only a research/probe ranking. Require multiple snapshots for stability.
          hmap={}
          for h in history:
            for x in h.get('quotes',[]):
              hmap.setdefault(x['code'],[]).append(x)

          cand=[]
          for x in parsed:
            p=x.get('probe_pct')
            if p is None or p<0.8 or p>7.0:continue
            hs=hmap.get(x['code'],[])
            valid=[q for q in hs if q.get('probe_pct') is not None]
            stable=len(valid)>=2
            if stable:
              vals=[q['probe_pct'] for q in valid[-3:]]
              spread=max(vals)-min(vals)
            else:spread=99
            score=50+min(25,p*5)+max(-10,min(15,x['imbalance']*.15))
            if stable and spread<=1.5:score+=10
            elif stable and spread>3:score-=15
            cand.append({**x,'snapshots':len(valid),'stability_spread':round(spread,2) if spread<90 else None,
                         'preopen_score':round(max(0,min(100,score))),
                         'status':'盤前優先觀察' if stable and spread<=1.5 and score>=70 else '資料觀察中'})

          cand=sorted(cand,key=lambda x:(x['preopen_score'],x.get('probe_pct') or -99),reverse=True)[:5]
          result={
            'version':'3.7.1-test',
            'updated_at':now.isoformat(),
            'mode':'PREOPEN_PROBE',
            'source':'TWSE MIS getStockInfo',
            'requested_symbols':len(symbols),
            'received_quotes':len(parsed),
            'errors':errors[:10],
            'top5':cand,
            'history':history,
            'warning':'測試版：盤前資料只用來提早觀察，09:00後仍須由V3.7實際成交條件確認，不能把試撮價直接視為可成交進場價。'
          }
          with open('v371-preopen.json','w',encoding='utf8') as f:
            json.dump(result,f,ensure_ascii=False,separators=(',',':'))
          print(json.dumps({k:v for k,v in result.items() if k!='history'},ensure_ascii=False,indent=2))
          PY
          python /tmp/v371.py

      - name: Commit probe result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v371-preopen.json /tmp/v371-preopen.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/v371-preopen.json v371-preopen.json
          git add v371-preopen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.7.1 preopen probe"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v371-preopen.json v371-preopen.json
            git add v371-preopen.json
            git diff --cached --quiet || git commit -m "Update V3.7.1 preopen probe"
            sleep $((i*2))
          done
          exit 1
