name: Update Taiwan Market Data V2.5

on:
  workflow_dispatch:
  schedule:
    - cron: '0,10,20,30,40,50 1-5 * * 1-5'
    - cron: '0 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-market-v25
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Build safe market snapshot
        run: |
          python - <<'PY'
          import json,re,time,datetime,requests,os
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          now=datetime.datetime.now(TZ)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 TaiwanStockRadar/2.5'})
          out={'updated_at':now.isoformat(),'quote_date':now.strftime('%Y-%m-%d'),
               'twse':[],'tpex':[],'errors':[]}

          def n(v):
              if v is None:return None
              s=str(v).replace(',','').replace('+','').strip()
              if s in ('','---','--','--.--','除權','除息'):return None
              try:return float(s)
              except:return None

          def getjson(url,params=None,tries=4):
              last=None
              for i in range(tries):
                  try:
                      r=S.get(url,params=params,timeout=35); r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last=e; time.sleep(1.5*(i+1))
              raise last

          # TWSE: current official all-stock snapshot, stable OpenAPI fallback.
          try:
              j=getjson('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX',
                        {'date':now.strftime('%Y%m%d'),'type':'ALL','response':'json'})
              found={}
              for t in j.get('tables') or []:
                  for row in t.get('data') or []:
                      if not isinstance(row,list) or len(row)<11: continue
                      code=str(row[0]).strip().upper()
                      if not re.fullmatch(r'\d{4,6}[A-Z]?',code): continue
                      close=n(row[8])
                      if close is None: continue
                      ch=n(row[10]); sign=str(row[9])
                      if ch is not None and ('-' in sign or 'green' in sign.lower()): ch=-abs(ch)
                      found[code]={'code':code,'name':str(row[1]).strip(),'market':'上市',
                        'volume':n(row[2]),'value':n(row[4]),'open':n(row[5]),
                        'high':n(row[6]),'low':n(row[7]),'close':close,'change':ch}
              out['twse']=list(found.values())
              if len(out['twse'])<700: raise RuntimeError('TWSE count too low: '+str(len(out['twse'])))
          except Exception as e:
              out['errors'].append('TWSE MI_INDEX '+repr(e))
              try:
                  data=getjson('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL')
                  for x in data:
                      code=str(x.get('Code','')).strip().upper()
                      if re.fullmatch(r'\d{4,6}[A-Z]?',code) and n(x.get('ClosingPrice')) is not None:
                          out['twse'].append({'code':code,'name':x.get('Name',''),'market':'上市',
                            'close':n(x.get('ClosingPrice')),'open':n(x.get('OpeningPrice')),
                            'high':n(x.get('HighestPrice')),'low':n(x.get('LowestPrice')),
                            'volume':n(x.get('TradeVolume')),'value':n(x.get('TradeValue')),
                            'change':n(x.get('Change'))})
              except Exception as e2: out['errors'].append('TWSE fallback '+repr(e2))

          # TPEx: official OpenAPI. This avoids the retired/changed legacy HTML endpoint.
          try:
              data=getjson('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes')
              for x in data:
                  code=str(x.get('SecuritiesCompanyCode') or x.get('Code') or '').strip().upper()
                  if not re.fullmatch(r'\d{4,6}[A-Z]?',code): continue
                  close=n(x.get('Close') or x.get('ClosingPrice'))
                  if close is None: continue
                  out['tpex'].append({
                    'code':code,
                    'name':x.get('CompanyName') or x.get('Name') or '',
                    'market':'上櫃',
                    'close':close,
                    'change':n(x.get('Change')),
                    'open':n(x.get('Open') or x.get('OpeningPrice')),
                    'high':n(x.get('High') or x.get('HighestPrice')),
                    'low':n(x.get('Low') or x.get('LowestPrice')),
                    'volume':n(x.get('TradingShares') or x.get('TradeVolume')),
                    'value':n(x.get('TransactionAmount') or x.get('TradeValue'))
                  })
              if len(out['tpex'])<500: raise RuntimeError('TPEx count too low: '+str(len(out['tpex'])))
          except Exception as e:
              out['errors'].append('TPEx '+repr(e))

          total=len(out['twse'])+len(out['tpex'])
          print('TWSE',len(out['twse']),'TPEx',len(out['tpex']),'TOTAL',total,'errors',out['errors'])

          # Critical guard: NEVER overwrite a good snapshot with empty/partial data.
          if len(out['twse'])<700 or len(out['tpex'])<500 or total<1400:
              raise SystemExit('SAFETY STOP: snapshot incomplete; market.json left unchanged')

          tmp='market.json.tmp'
          with open(tmp,'w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          os.replace(tmp,'market.json')
          PY

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          j=json.load(open('market.json',encoding='utf-8'))
          a=len(j.get('twse',[])); b=len(j.get('tpex',[]))
          assert a>=700 and b>=500 and a+b>=1400, (a,b)
          print("VALID:",a,b,a+b)
          PY

      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp market.json /tmp/market.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market.json market.json
          git add market.json
          git diff --cached --quiet && exit 0
          git commit -m "Update safe market snapshot V2.5"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1
