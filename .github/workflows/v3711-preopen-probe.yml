name: V3.7.1.2 Preopen Auction Probe

on:
  workflow_dispatch:
  schedule:
    # Taiwan weekdays 08:30-08:58 (UTC+8)
    - cron: '30,35,40,45,50,55,58 0 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-stock-v3712-preopen
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: V3.7.1.2 frozen preopen probe
        run: |
          cat > /tmp/v3712.py <<'PY'
          import requests,json,datetime,time,re,sys
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          now=datetime.datetime.now(TZ)

          # Hard freeze: a delayed/manual run after 09:00 must never overwrite preopen data.
          if (now.hour,now.minute) >= (9,0):
            print('PREOPEN FROZEN: Taiwan time',now.isoformat())
            sys.exit(0)

          def num(v):
            try:
              s=str(v).replace(',','').replace('+','').strip()
              return None if s in ('','-','--','---','None') else float(s)
            except:return None

          try:
            market=json.load(open('market.json',encoding='utf8'))
          except Exception as e:
            raise SystemExit('market.json unavailable: '+repr(e))

          meta={}
          for mk,key in [('上市','twse'),('上櫃','tpex')]:
            for x in market.get(key,[]) or []:
              c=str(x.get('code','')).strip()
              if re.fullmatch(r'\d{4}',c):
                meta[c]={'name':x.get('name',c),'market':mk,'prev_close':num(x.get('close'))}
          if len(meta)<1500:
            raise SystemExit('SAFETY STOP: universe too small '+str(len(meta)))

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153 Safari/537.36',
                            'Referer':'https://mis.twse.com.tw/stock/index.jsp'})
          syms=[('tse' if m['market']=='上市' else 'otc')+'_'+c+'.tw' for c,m in meta.items()]
          rows=[]; errors=[]
          for i in range(0,len(syms),60):
            batch=syms[i:i+60]
            for attempt in range(3):
              try:
                r=S.get('https://mis.twse.com.tw/stock/api/getStockInfo.jsp',
                  params={'ex_ch':'|'.join(batch),'json':'1','delay':'0','_':str(int(time.time()*1000))},timeout=25)
                r.raise_for_status(); rows += r.json().get('msgArray') or []; break
              except Exception as e:
                if attempt==2: errors.append('MIS '+repr(e))
                time.sleep(attempt+1)

          def preopen_time_ok(t):
            if not t:return True
            m=re.match(r'(\d{1,2}):(\d{2})',str(t))
            if not m:return True
            return (int(m.group(1)),int(m.group(2))) < (9,0)

          parsed=[]; rejected_postopen=0
          for z in rows:
            c=str(z.get('c') or '').strip()
            if not re.fullmatch(r'\d{4}',c):continue
            if not preopen_time_ok(z.get('t')):
              rejected_postopen+=1; continue
            m=meta.get(c,{})
            ref=num(z.get('y')) or m.get('prev_close')
            bids=[num(v) for v in str(z.get('b') or '').split('_')]
            asks=[num(v) for v in str(z.get('a') or '').split('_')]
            bids=[v for v in bids if v is not None]; asks=[v for v in asks if v is not None]
            bidv=[num(v) or 0 for v in str(z.get('g') or '').split('_') if str(v).strip()]
            askv=[num(v) or 0 for v in str(z.get('f') or '').split('_') if str(v).strip()]
            px=num(z.get('z'))
            if px is None:
              if bids and asks:px=(bids[0]+asks[0])/2
              elif bids:px=bids[0]
              elif asks:px=asks[0]
            pct=(px/ref-1)*100 if px is not None and ref else None
            bv=sum(bidv[:5]); av=sum(askv[:5])
            imb=(bv-av)/(bv+av)*100 if bv+av else 0
            parsed.append({'code':c,'name':z.get('n') or m.get('name') or c,'market':m.get('market'),
              'reference':ref,'probe_price':px,'probe_pct':round(pct,2) if pct is not None else None,
              'best_bid':bids[0] if bids else None,'best_ask':asks[0] if asks else None,
              'bid5_volume':bv,'ask5_volume':av,'imbalance':round(imb,1),
              'raw_time':z.get('t'),'raw_date':z.get('d')})

          try:
            old=json.load(open('v371-preopen.json',encoding='utf8'))
            history=old.get('history',[])
          except: history=[]

          # Never carry contaminated >=09:00 snapshots forward.
          clean=[]
          for h in history:
            try:
              dt=datetime.datetime.fromisoformat(h.get('at',''))
              if (dt.hour,dt.minute)<(9,0): clean.append(h)
            except: pass
          snap={'at':now.isoformat(),'count':len(parsed),
                'quotes':[{k:x.get(k) for k in ('code','probe_price','probe_pct','imbalance')} for x in parsed]}
          history=(clean+[snap])[-8:]
          hm={}
          for h in history:
            for q in h.get('quotes',[]): hm.setdefault(q['code'],[]).append(q)

          cand=[]
          for x in parsed:
            p=x.get('probe_pct')
            if p is None or p<0.8 or p>7:continue
            vals=[q['probe_pct'] for q in hm.get(x['code'],[]) if q.get('probe_pct') is not None]
            stable=len(vals)>=2
            spread=max(vals[-3:])-min(vals[-3:]) if stable else None
            score=50+min(25,p*5)+max(-10,min(15,x['imbalance']*.15))
            if stable and spread<=1.5:score+=10
            elif stable and spread>3:score-=15
            cand.append({**x,'snapshots':len(vals),'stability_spread':round(spread,2) if spread is not None else None,
              'preopen_score':round(max(0,min(100,score))),
              'status':'盤前優先觀察' if stable and spread<=1.5 and score>=70 else '資料觀察中'})
          cand=sorted(cand,key=lambda x:(x['preopen_score'],x.get('probe_pct') or -99),reverse=True)[:5]

          result={'version':'3.7.1.2','updated_at':now.isoformat(),'frozen_at':now.isoformat() if now.hour==8 and now.minute>=58 else None,
            'mode':'PREOPEN_PROBE','source':'TWSE MIS getStockInfo + market.json universe',
            'universe_size':len(meta),'requested_symbols':len(syms),'received_quotes':len(parsed),
            'rejected_postopen_quotes':rejected_postopen,'errors':errors[:15],'top5':cand,'history':history,
            'warning':'盤前資料只接受09:00前報價；09:00後工作流程不覆寫此檔案。'}
          json.dump(result,open('v371-preopen.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          print(json.dumps({k:v for k,v in result.items() if k!='history'},ensure_ascii=False,indent=2))
          PY
          python /tmp/v3712.py

      - name: Commit result safely
        run: |
          # If the probe froze after 09:00, Python exits without changing the file.
          git diff --quiet v371-preopen.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v371-preopen.json /tmp/v371-preopen.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/v371-preopen.json v371-preopen.json
          git add v371-preopen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V3.7.1.2 frozen preopen probe"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main; git reset --hard origin/main
            cp /tmp/v371-preopen.json v371-preopen.json
            git add v371-preopen.json
            git diff --cached --quiet || git commit -m "Update V3.7.1.2 frozen preopen probe"
            sleep $((i*2))
          done
          exit 1
