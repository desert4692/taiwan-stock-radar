name: V3.6 Momentum Launch Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-stock-v36
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Build V3.6 momentum launch radar
        run: |
          cat > /tmp/v36.py <<'PY'
          import requests,json,re,datetime,time,math
          from bs4 import BeautifulSoup
          from collections import defaultdict
          TZ=datetime.timezone(datetime.timedelta(hours=8)); now=datetime.datetime.now(TZ)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 TaiwanStockRadar/3.6'})
          def num(v):
              try:return float(str(v).replace(',','').replace('+','').strip())
              except:return None
          def sma(a,n): return sum(a[-n:])/n if len(a)>=n else None
          def ema(a,n):
              if not a:return []
              k=2/(n+1); out=[a[0]]
              for x in a[1:]:out.append(x*k+out[-1]*(1-k))
              return out
          def stdev(a,n):
              if len(a)<n:return None
              x=a[-n:]; m=sum(x)/n
              return math.sqrt(sum((z-m)**2 for z in x)/n)
          def tr(rows,i):
              if i==0:return rows[i]['high']-rows[i]['low']
              return max(rows[i]['high']-rows[i]['low'],abs(rows[i]['high']-rows[i-1]['close']),abs(rows[i]['low']-rows[i-1]['close']))
          def atr(rows,n=14):
              if len(rows)<n+1:return None
              return sum(tr(rows,i) for i in range(len(rows)-n,len(rows)))/n
          def adx(rows,n=14):
              if len(rows)<n+2:return (0,0,0)
              trs=[]; plus=[]; minus=[]
              for i in range(1,len(rows)):
                  up=rows[i]['high']-rows[i-1]['high']; dn=rows[i-1]['low']-rows[i]['low']
                  trs.append(tr(rows,i)); plus.append(up if up>dn and up>0 else 0); minus.append(dn if dn>up and dn>0 else 0)
              if len(trs)<n:return (0,0,0)
              dx=[]
              for end in range(n,len(trs)+1):
                  T=sum(trs[end-n:end])
                  p=100*sum(plus[end-n:end])/T if T else 0; m=100*sum(minus[end-n:end])/T if T else 0
                  dx.append(100*abs(p-m)/(p+m) if p+m else 0)
              A=sum(dx[-n:])/min(n,len(dx)) if dx else 0
              T=sum(trs[-n:]); p=100*sum(plus[-n:])/T if T else 0; m=100*sum(minus[-n:])/T if T else 0
              return A,p,m
          def macdh(c):
              e12=ema(c,12); e26=ema(c,26); mac=[a-b for a,b in zip(e12,e26)]
              sig=ema(mac,9); return [a-b for a,b in zip(mac,sig)]
          try: market=json.load(open('market.json',encoding='utf8'))
          except: market={'twse':[],'tpex':[]}
          latest={str(x.get('code')):x for x in market.get('twse',[])+market.get('tpex',[]) if x.get('code')}
          histories=defaultdict(list)
          def add(code,date,o,h,l,c,v,mkt):
              if re.fullmatch(r'\d{4}',code or '') and None not in (h,l,c):
                  histories[code].append({'date':date,'open':o or c,'high':h,'low':l,'close':c,'volume':v or 0,'market':mkt})
          def twse(d):
              j=S.get('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX',params={'date':d.strftime('%Y%m%d'),'type':'ALLBUT0999','response':'json'},timeout=30).json()
              for tb in j.get('tables',[]):
                  fs=tb.get('fields') or []
                  if '證券代號' not in fs or '收盤價' not in fs:continue
                  ix={k:i for i,k in enumerate(fs)}
                  for z in tb.get('data') or []:
                      try:add(str(z[ix['證券代號']]).strip(),d.isoformat(),num(z[ix.get('開盤價')]),num(z[ix.get('最高價')]),num(z[ix.get('最低價')]),num(z[ix['收盤價']]),num(z[ix.get('成交股數')]),'上市')
                      except:pass
          def tpex(d):
              roc=f'{d.year-1911}/{d.month:02d}/{d.day:02d}'
              r=S.get('https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php',params={'l':'zh-tw','o':'htm','d':roc},timeout=30)
              for row in BeautifulSoup(r.text,'lxml').select('tr'):
                  z=[q.get_text(strip=True) for q in row.select('td')]
                  if len(z)>=10 and re.fullmatch(r'\d{4}',z[0]):add(z[0],d.isoformat(),num(z[4]),num(z[5]),num(z[6]),num(z[2]),num(z[8]),'上櫃')
          d=now.date()-datetime.timedelta(days=100)
          while d<=now.date():
              if d.weekday()<5:
                  try:twse(d)
                  except Exception as e:print('TWSE',d,e)
                  try:tpex(d)
                  except Exception as e:print('TPEx',d,e)
                  time.sleep(.06)
              d+=datetime.timedelta(days=1)
          # TAIEX proxy: 0050 cross-sectional RS benchmark if available; otherwise market median momentum.
          raw=[]
          for code,h in histories.items():
              h=sorted({z['date']:z for z in h}.values(),key=lambda z:z['date'])
              if len(h)<45:continue
              q=latest.get(code,{})
              c=num(q.get('close')) or h[-1]['close']; value=num(q.get('value')) or 0
              if c<5 or value<3e7:continue
              if abs(h[-1]['close']-c)>1e-9:
                  h.append({'date':now.date().isoformat(),'open':num(q.get('open')) or c,'high':num(q.get('high')) or c,'low':num(q.get('low')) or c,'close':c,'volume':num(q.get('volume')) or 0,'market':h[-1]['market']})
              cs=[z['close'] for z in h]; vs=[z['volume'] for z in h]
              ma5=sma(cs,5); ma20=sma(cs,20); sd20=stdev(cs,20)
              bw=(4*sd20/ma20*100) if ma20 and sd20 else 99
              widths=[]
              for k in range(20,min(40,len(cs))+1):
                  x=cs[-k:-k+20] if k>20 else cs[-20:]
                  if len(x)==20:
                      m=sum(x)/20; sd=(sum((v-m)**2 for v in x)/20)**.5
                      widths.append(4*sd/m*100 if m else 99)
              squeeze_score=max(0,min(100,100-bw*12))
              mh=macdh(cs); accel=(mh[-1]-mh[-2])+(mh[-2]-mh[-3]) if len(mh)>=3 else 0
              macd_score=50
              if len(mh)>=3:
                  if mh[-1]>mh[-2]>mh[-3]:macd_score=95 if mh[-1]>0 else 82
                  elif mh[-1]>mh[-2]:macd_score=68
                  elif mh[-1]<mh[-2]<mh[-3]:macd_score=20
              A,pdi,mdi=adx(h)
              adx_score=95 if A>=20 and pdi>mdi else 75 if pdi>mdi else 35
              av20=sum(vs[-21:-1])/20 if len(vs)>=21 else sma(vs,20)
              vr=(vs[-1]/av20) if av20 else 0
              pct=(c/cs[-2]-1)*100 if len(cs)>1 and cs[-2] else 0
              vol_score=100 if 1.5<=vr<=3.5 else 82 if 1.2<=vr<1.5 else 60 if .9<=vr<1.2 else 35
              if vr>5:vol_score=35
              m5=(c/cs[-6]-1)*100 if len(cs)>=6 else 0
              m20=(c/cs[-21]-1)*100 if len(cs)>=21 else 0
              bias=(c/ma5-1)*100 if ma5 else 99
              prior20=max(cs[-21:-1]) if len(cs)>=21 else c
              near_break=(c/prior20-1)*100
              raw.append({'code':code,'name':q.get('name') or code,'market':q.get('market') or h[-1]['market'],'close':c,'pct':pct,'value':value,
                'm5':m5,'m20':m20,'bias5':bias,'volume_ratio':vr,'squeeze_score':squeeze_score,'boll_width':bw,'macd_score':macd_score,'macd_accel':accel,
                'adx':A,'plus_di':pdi,'minus_di':mdi,'adx_score':adx_score,'volume_score':vol_score,'near_breakout_pct':near_break,'ma5':ma5,'ma20':ma20})
          # RS percentile: 5d and 20d relative to whole eligible universe.
          def pct_rank(vals,x):
              if not vals:return 50
              return 100*sum(v<=x for v in vals)/len(vals)
          m5s=[x['m5'] for x in raw]; m20s=[x['m20'] for x in raw]
          out=[]
          for x in raw:
              rs5=pct_rank(m5s,x['m5']); rs20=pct_rank(m20s,x['m20'])
              rs_acc=max(0,min(100,50+(rs5-rs20)*1.5))
              # favor strengthening stocks, not already extended leaders
              score=x['squeeze_score']*.25+rs_acc*.25+x['volume_score']*.20+x['macd_score']*.15+x['adx_score']*.15
              penalties=[]; pen=0
              if x['bias5']>7:pen+=18;penalties.append('5MA乖離過大')
              elif x['bias5']>5:pen+=8;penalties.append('5MA乖離偏高')
              if x['pct']>=7:pen+=18;penalties.append('單日漲幅過熱')
              elif x['pct']>=5:pen+=8;penalties.append('單日漲幅偏高')
              if x['volume_ratio']>5:pen+=12;penalties.append('爆量過熱')
              if x['near_breakout_pct']>4:pen+=8;penalties.append('已遠離整理區')
              final=max(0,min(100,round(score-pen)))
              x.update({'rs5':round(rs5,1),'rs20':round(rs20,1),'rs_accel':round(rs_acc,1),'launch_score':final,'penalties':penalties})
              if final>=55 and x['volume_ratio']>=.9 and x['pct']<9:x['signal']='蓄勢轉強' if x['squeeze_score']>=60 else '動能轉強'
              else:x['signal']='觀察'
              out.append(x)
          top=sorted(out,key=lambda x:(x['launch_score'],x['value']),reverse=True)[:5]
          result={'version':'3.6','updated_at':now.isoformat(),'model':'Momentum Launch Radar',
            'weights':{'squeeze':25,'rs_acceleration':25,'volume_price':20,'macd_acceleration':15,'adx_di':15},
            'eligible_count':len(out),'top5':top,
            'note':'V3.6 動能發動雷達：找蓄勢→相對強度加速→量價轉強→MACD動能加速→ADX趨勢形成，並扣除過熱。SAR不參與排名。'}
          json.dump(result,open('momentum-v36.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          python /tmp/v36.py
      - name: Commit V3.6 result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp momentum-v36.json /tmp/momentum-v36.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/momentum-v36.json momentum-v36.json
          git add momentum-v36.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V3.6 momentum launch radar"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/momentum-v36.json momentum-v36.json
            git add momentum-v36.json
            if ! git diff --cached --quiet; then git commit -m "Update V3.6 momentum launch radar"; fi
            sleep $((i * 2))
          done
          exit 1
