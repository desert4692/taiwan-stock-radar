name: ETF Entry Exit Radar Test V2
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf-entry-exit-radar-v2
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Calculate ETF Radar V2
        run: |
          cat > /tmp/e.py <<'PY'
          import requests,json,datetime,time,statistics
          TZ=datetime.timezone(datetime.timedelta(hours=8)); now=datetime.datetime.now(TZ)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 TaiwanStockRadar ETF-V2'})
          def n(x):
            try:return float(str(x).replace(',','').replace('+','').strip())
            except:return None
          def sma(a,k):return sum(a[-k:])/k if len(a)>=k else None
          def ema(a,k):
            q=2/(k+1);o=[a[0]]
            for x in a[1:]:o.append(x*q+o[-1]*(1-q))
            return o
          def atr(r,k=14):
            t=[]
            for i,x in enumerate(r):
              p=r[i-1]['c'] if i else x['c']
              t.append(max(x['h']-x['l'],abs(x['h']-p),abs(x['l']-p)))
            return sum(t[-k:])/k
          def psar(r,step=.02,mx=.2):
            bull=r[1]['c']>=r[0]['c'];ep=max(r[0]['h'],r[1]['h']) if bull else min(r[0]['l'],r[1]['l'])
            s=min(r[0]['l'],r[1]['l']) if bull else max(r[0]['h'],r[1]['h']);af=step
            for i in range(2,len(r)):
              q=s+af*(ep-s)
              if bull:
                q=min(q,r[i-1]['l'],r[i-2]['l'])
                if r[i]['l']<q:bull=False;q=ep;ep=r[i]['l'];af=step
                elif r[i]['h']>ep:ep=r[i]['h'];af=min(mx,af+step)
              else:
                q=max(q,r[i-1]['h'],r[i-2]['h'])
                if r[i]['h']>q:bull=True;q=ep;ep=r[i]['h'];af=step
                elif r[i]['l']<ep:ep=r[i]['l'];af=min(mx,af+step)
              s=q
            return s,1 if bull else -1
          def ind(r):
            c=[x['c'] for x in r];m5=sma(c,5);m10=sma(c,10);m20=sma(c,20);m60=sma(c,60)
            e12,e26=ema(c,12),ema(c,26);dif=e12[-1]-e26[-1];sig=ema([x-y for x,y in zip(e12,e26)],9)[-1]
            sd=(sum((x-m20)**2 for x in c[-20:])/20)**.5;sar,st=psar(r)
            return {'ma5':m5,'ma10':m10,'ma20':m20,'ma60':m60,'macd_hist':dif-sig,'atr':atr(r),
                    'sar':sar,'sar_trend':st,'boll_upper':m20+2*sd,'boll_lower':m20-2*sd}
          def months(k=7):
            y,m=now.year,now.month;o=[]
            for _ in range(k):
              o.append((y,m));m-=1
              if m==0:y-=1;m=12
            return list(reversed(o))
          def stock(code):
            o={}
            for y,m in months():
              j=S.get('https://www.twse.com.tw/exchangeReport/STOCK_DAY',params={'response':'json','date':f'{y}{m:02d}01','stockNo':code},timeout=30).json()
              for z in j.get('data',[]):
                if len(z)>=9 and n(z[6]) is not None:o[z[0]]={'d':z[0],'o':n(z[3]),'h':n(z[4]),'l':n(z[5]),'c':n(z[6]),'v':n(z[1]) or 0}
              time.sleep(.08)
            return list(o.values())
          def taiex():
            o={}
            for y,m in months():
              j=S.get('https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST',params={'response':'json','date':f'{y}{m:02d}01'},timeout=30).json()
              for z in j.get('data',[]):
                if len(z)>=5 and n(z[4]) is not None:o[z[0]]={'d':z[0],'o':n(z[1]),'h':n(z[2]),'l':n(z[3]),'c':n(z[4]),'v':0}
              time.sleep(.08)
            return list(o.values())
          def normalize_splits(r):
            # 將分割前歷史價自動調整到目前價格尺度；偵測相鄰收盤價的巨大比例跳空。
            r=[dict(x) for x in r]; events=[]
            for i in range(1,len(r)):
              a,b=r[i-1]['c'],r[i]['c']
              ratio=a/b if b else 1
              candidates=[2,3,4,5,10]
              factor=min(candidates,key=lambda x:abs(ratio-x))
              if ratio>1.7 and abs(ratio-factor)/factor<.18:
                events.append({'index':i,'date':r[i]['d'],'factor':factor,'raw_ratio':ratio})
                for j in range(i):
                  for k in ('o','h','l','c'):r[j][k]/=factor
            return r,events
          def market(r):
            x=ind(r);c=r[-1]['c'];trend=50
            trend+=12 if c>x['ma20'] else -12
            trend+=15 if x['ma5']>x['ma10']>x['ma20'] else (-15 if x['ma5']<x['ma10']<x['ma20'] else 0)
            trend+=10 if x['ma20']>x['ma60'] else -8;trend+=8 if x['macd_hist']>0 else -8;trend+=8 if x['sar_trend']>0 else -8
            trend=max(0,min(100,round(trend)))
            entry=trend
            bias5=(c/x['ma5']-1)*100; bias20=(c/x['ma20']-1)*100
            if c>=x['boll_upper']:entry-=18
            elif c>=x['boll_upper']-.25*x['atr']:entry-=10
            if bias5>4:entry-=12
            if bias20>7:entry-=10
            entry=max(0,min(100,round(entry)))
            return {'close':c,'trend_score':trend,'entry_score':entry,'state':'偏多' if trend>=65 else ('偏弱' if trend<=40 else '震盪'),
                    'overheat':entry<trend,'bias5':bias5,'bias20':bias20,'indicators':x}
          def plan(code,r,mkt,lev=False):
            x=ind(r);c=r[-1]['c'];a=x['atr'];bias=(c/x['ma5']-1)*100
            trend=50+(mkt['trend_score']-50)*(.45 if lev else .30)
            trend+=8 if c>x['ma5'] else -5;trend+=7 if c>x['ma10'] else -4;trend+=8 if c>x['ma20'] else -7
            trend+=8 if x['ma5']>x['ma10']>x['ma20'] else 0;trend+=7 if x['sar_trend']>0 else -7;trend+=5 if x['macd_hist']>0 else -5
            trend=max(0,min(100,round(trend)))
            entry=trend
            if -1<=bias<=3:entry+=10
            elif bias>6:entry-=28
            elif bias>4:entry-=18
            if c>=x['boll_upper']:entry-=20
            elif c>=x['boll_upper']-.25*a:entry-=10
            if mkt['overheat']:entry-=8 if lev else 5
            entry=max(0,min(100,round(entry)))
            ctr=(x['ma5']+x['ma10'])/2;lo=max(x['ma20'],ctr-a*(.55 if lev else .35));hi=ctr+a*(.25 if lev else .15)
            if lo>hi:lo,hi=hi,lo
            rh=max(q['h'] for q in r[-20:-1]);rl=min(q['l'] for q in r[-20:])
            br=rh+a*(.08 if lev else .05);nc=max(x['boll_upper'],x['ma5']+a*(1.35 if lev else 1.05))
            stop=min(x['ma20']-a*(.65 if lev else .45),rl);ref=(lo+hi)/2;risk=max(a*.5,ref-stop)
            tp1=ref+risk*(1.35 if lev else 1.5);tp2=ref+risk*(2.2 if lev else 2.4)
            if c<=stop:status='🔴 轉弱／暫停進場'
            elif c>nc:status='🔴 過熱不追'
            elif lo<=c<=hi and mkt['entry_score']>=50:status='🟢 拉回觀察進場'
            elif c>=br and c<=nc and mkt['entry_score']>=55:status='🟢 突破確認'
            elif c<lo:status='🟡 等待轉強'
            else:status='🟡 等拉回／等突破'
            return {'code':code,'close':c,'trend_score':trend,'entry_score':entry,'status':status,'pullback_low':lo,'pullback_high':hi,
                    'breakout':br,'no_chase':nc,'take_profit1':tp1,'take_profit2':tp2,'stop':stop,'bias5':bias,'indicators':x}
          ix=taiex();e50=stock('0050');levraw=stock('00685L');lev,events=normalize_splits(levraw)
          if min(len(ix),len(e50),len(lev))<60:raise Exception(f'資料不足 TAIEX={len(ix)} 0050={len(e50)} 00685L={len(lev)}')
          m=market(ix);a=plan('0050',e50,m);b=plan('00685L',lev,m,True)
          out={'version':'ETF-test-2','updated_at':now.isoformat(),'market':m,'etfs':[a,b],
               'adjustments':{'00685L_split_events':events},
               'note':'V2：趨勢/進場分數分離；大盤過熱扣分；00685L自動偵測並調整歷史價格尺度。'}
          json.dump(out,open('etf-radar-v2.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python /tmp/e.py
      - name: Commit V2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp etf-radar-v2.json /tmp/result.json
          git fetch origin main && git reset --hard origin/main
          cp /tmp/result.json etf-radar-v2.json
          git add etf-radar-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Update ETF radar V2"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git reset --hard origin/main
            cp /tmp/result.json etf-radar-v2.json;git add etf-radar-v2.json
            git diff --cached --quiet || git commit -m "Update ETF radar V2"
            sleep $((i*2))
          done
          exit 1
